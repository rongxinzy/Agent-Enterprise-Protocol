name: aep-m0

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: aep
      POSTGRES_USER: aep
      POSTGRES_PASSWORD: aep
    healthcheck:
      test: [CMD-SHELL, pg_isready -U aep -d aep]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - ${AEP_MINIO_CONSOLE_PORT:-9001}:9001
    volumes:
      - minio-data:/data

  control-service:
    build:
      context: ../..
      dockerfile: services/control-service/Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      AEP_ENVIRONMENT: ${AEP_ENVIRONMENT:-development}
      AEP_LOG_FORMAT: ${AEP_LOG_FORMAT:-text}
      AEP_LOG_LEVEL: ${AEP_LOG_LEVEL:-info}
      AEP_ADDRESS: :8080
      AEP_DATABASE_URL: postgres://aep:aep@postgres:5432/aep?sslmode=disable
      AEP_MINIO_ENDPOINT: minio:9000
      AEP_MINIO_ACCESS_KEY: minioadmin
      AEP_MINIO_SECRET_KEY: minioadmin
      AEP_MINIO_BUCKET: aep-skills
      AEP_ISSUER: http://localhost:${AEP_PORT:-8080}
      AEP_SIGNING_KEY_BASE64: MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE=
      AEP_CREDENTIAL_MASTER_KEY_BASE64: ${AEP_CREDENTIAL_MASTER_KEY_BASE64:-QUVQLU0yLWNyZWRlbnRpYWwta2V5LTMyLWJ5dGVzISE=}
      AEP_MODEL_GATEWAY_BASE_URL: ${AEP_MODEL_GATEWAY_BASE_URL:-}
      AEP_DEPLOYMENT_ID: ${AEP_DEPLOYMENT_ID:-demo}
      AEP_DEPLOYMENT_NAME: ${AEP_DEPLOYMENT_NAME:-Demo Deployment}
      AEP_BOOTSTRAP_ENTERPRISE_ID: demo
      AEP_BOOTSTRAP_ENTERPRISE_NAME: Demo Enterprise
      AEP_BOOTSTRAP_ADMIN_USERNAME: admin
      AEP_BOOTSTRAP_ADMIN_PASSWORD: change-this-admin-password
      AEP_LOGIN_FAILURE_LIMIT: ${AEP_LOGIN_FAILURE_LIMIT:-5}
      AEP_LOGIN_FAILURE_WINDOW: ${AEP_LOGIN_FAILURE_WINDOW:-15m}
      AEP_LOGIN_BACKOFF_BASE: ${AEP_LOGIN_BACKOFF_BASE:-30s}
      AEP_LOGIN_BACKOFF_MAX: ${AEP_LOGIN_BACKOFF_MAX:-15m}
    ports:
      - ${AEP_PORT:-8080}:8080
    healthcheck:
      test: [CMD, /aep-control, healthcheck, http://127.0.0.1:8080/readyz]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

volumes:
  postgres-data:
  minio-data:
