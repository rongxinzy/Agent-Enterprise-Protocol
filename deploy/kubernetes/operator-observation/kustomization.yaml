apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Sensitive port-forward permission is a separate reviewed opt-in.
resources:
  - ../operator
  - ../../../services/gateway-operator/config/observation
patches:
  - target: {group: apps, version: v1, kind: Deployment, name: aep-gateway-operator}
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: aep-gateway-operator, namespace: aep-system}
      spec:
        template:
          spec:
            containers:
              - name: manager
                env:
                  - name: AEP_GATEWAY_OBSERVATION_DEPLOYMENT
                    value: higress-gateway
