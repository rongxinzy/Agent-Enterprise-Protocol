apiVersion: v1
kind: ConfigMap
metadata:
  name: aep-gateway-reconciler-config
  namespace: aep-system
data:
  AEP_RECONCILER_CONTROL_URL: http://aep-control-service.aep-system.svc.cluster.local:8080
  AEP_RECONCILER_TENANTS: enterprise
  AEP_RECONCILER_ADDRESS: ":8091"
  AEP_RECONCILER_OUTPUT_DIR: /var/lib/aep-reconciler
  AEP_RECONCILER_INTERVAL: 15s
  AEP_DATA_PLANE_RECONCILER_TOKEN_FILE: /var/run/aep-secrets/reconciler-token
---
apiVersion: v1
kind: Service
metadata:
  name: aep-gateway-reconciler
  namespace: aep-system
spec:
  selector:
    app.kubernetes.io/name: aep-gateway-reconciler
  ports:
    - name: health
      port: 8091
      targetPort: health
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aep-gateway-reconciler
  namespace: aep-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: aep-gateway-reconciler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aep-gateway-reconciler
    spec:
      serviceAccountName: aep-gateway-reconciler
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: {app.kubernetes.io/name: aep-gateway-reconciler}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: aep-gateway-reconciler}
      containers:
        - name: gateway-reconciler
          image: aep-gateway-reconciler:0.1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: aep-gateway-reconciler-config}
          ports:
            - name: health
              containerPort: 8091
          volumeMounts:
            - name: secrets
              mountPath: /var/run/aep-secrets
              readOnly: true
            - name: render-output
              mountPath: /var/lib/aep-reconciler
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: 500m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
            runAsNonRoot: true
          livenessProbe:
            httpGet: {path: /livez, port: health}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: health}
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: secrets
          secret:
            secretName: aep-control-service-secrets
            items:
              - key: reconciler-token
                path: reconciler-token
        # Each replica owns an independent scratch directory. This PR does not
        # expose it as a live Higress configuration source.
        - name: render-output
          emptyDir: {}
