# Agent control protocol service — the desktop-agent runtime surface
# (/aep/v1/user/*: heartbeat, control-event inbox, skill delivery, telemetry,
# model connection, credential resolution) plus shared session auth and
# discovery. Shares the control plane's PostgreSQL, MinIO, signing key, and
# credential keyring (same secret, read-only), so sessions and tokens are
# valid on both services. The control-service continues to mount the same
# routes for all-in-one deployments; split deployments route /aep/v1/user,
# /aep/v1/auth, and /.well-known here and tighten the control-service's
# ingress to management callers only.
apiVersion: v1
kind: ConfigMap
metadata:
  name: aep-agent-control-config
  namespace: aep-system
data:
  AEP_ENVIRONMENT: production
  AEP_ENABLE_MOCK_FEDERATED_AUTH: "false"
  AEP_LOG_FORMAT: json
  AEP_LOG_LEVEL: info
  AEP_ADDRESS: ":8080"
  AEP_ISSUER: https://aep.example.com
  AEP_MINIO_ENDPOINT: minio.example.internal:9000
  AEP_MINIO_BUCKET: aep-skills
  AEP_MINIO_SECURE: "true"
  AEP_ACCESS_TTL: 15m
  AEP_MODEL_ACCESS_TTL: 15m
  AEP_REFRESH_TTL: 720h
  AEP_HTTP_READ_HEADER_TIMEOUT: 5s
  AEP_HTTP_READ_TIMEOUT: 15s
  AEP_HTTP_WRITE_TIMEOUT: 30s
  AEP_HTTP_IDLE_TIMEOUT: 60s
  AEP_HTTP_SHUTDOWN_TIMEOUT: 10s
  AEP_HTTP_MAX_HEADER_BYTES: "1048576"
  AEP_LOGIN_FAILURE_LIMIT: "5"
  AEP_LOGIN_SOURCE_FAILURE_LIMIT: "100"
  AEP_LOGIN_FAILURE_WINDOW: 15m
  AEP_LOGIN_BACKOFF_BASE: 30s
  AEP_LOGIN_BACKOFF_MAX: 15m
  # Client-facing address of THIS service, advertised through the
  # control-service's /aep/v1/metadata (agentControl.baseUrl) so desktop
  # agents discover the split endpoint. Empty keeps discovery silent.
  AEP_AGENT_CONTROL_BASE_URL: https://agents.aep.example.com
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aep-agent-control
  namespace: aep-system
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: aep-agent-control
  namespace: aep-system
spec:
  selector:
    app.kubernetes.io/name: aep-agent-control
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aep-agent-control
  namespace: aep-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: aep-agent-control
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aep-agent-control
    spec:
      serviceAccountName: aep-agent-control
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app.kubernetes.io/name: aep-agent-control}
      containers:
        - name: agent-control
          image: aep-agent-control:0.1.0
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef: {name: aep-agent-control-config}
            - configMapRef: {name: aep-control-service-config}
          env:
            - name: AEP_DATABASE_URL_FILE
              value: /var/run/aep-secrets/database-url
            - name: AEP_MINIO_ACCESS_KEY_FILE
              value: /var/run/aep-secrets/minio-access-key
            - name: AEP_MINIO_SECRET_KEY_FILE
              value: /var/run/aep-secrets/minio-secret-key
            - name: AEP_SIGNING_KEY_BASE64_FILE
              value: /var/run/aep-secrets/ed25519-seed
            - name: AEP_LICENSE_TRUSTED_KEYS_FILE
              value: /var/run/aep-secrets/license-trusted-keys.json
            - name: AEP_LICENSE_FILE
              value: /var/run/aep-secrets/license.zylic
            - name: AEP_CREDENTIAL_MASTER_KEY_BASE64_FILE
              value: /var/run/aep-secrets/credential-keyring
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: secrets
              mountPath: /var/run/aep-secrets
              readOnly: true
          resources:
            # The agent surface is heartbeat/event-poll bound: many long-lived
            # connections, small requests. Scale independently of the admin
            # console's usage profile.
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
            runAsNonRoot: true
          livenessProbe:
            httpGet: {path: /livez, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          startupProbe:
            httpGet: {path: /livez, port: http}
            failureThreshold: 30
            periodSeconds: 2
      volumes:
        # Shared with the control-service: same database, blob store, signing
        # key, and credential keyring — the split is a process and network
        # boundary, not a data boundary.
        - name: secrets
          secret:
            secretName: aep-control-service-secrets
