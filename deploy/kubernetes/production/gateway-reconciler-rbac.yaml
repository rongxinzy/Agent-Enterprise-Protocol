apiVersion: v1
kind: ServiceAccount
metadata:
  name: aep-gateway-reconciler
  namespace: aep-system
---
# Lease creation addresses the collection; Kubernetes cannot restrict create
# by resourceNames. Reading/updating is limited to this elector's named Lease.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aep-gateway-reconciler-leader
  namespace: aep-system
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [gateway-reconciler-leader]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aep-gateway-reconciler-leader
  namespace: aep-system
subjects:
  - kind: ServiceAccount
    name: aep-gateway-reconciler
    namespace: aep-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aep-gateway-reconciler-leader
---
# The reconciler is granted only the Higress objects it owns. Its live
# server-side apply implementation is introduced with the data-plane E2E gate.
# Absolute OpenAI upstreams and Anthropic passthrough render an EnvoyFilter per model, hence
# the networking.istio.io rule.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aep-gateway-reconciler
  namespace: higress-system
rules:
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch, create, patch, update, delete]
  - apiGroups: [extensions.higress.io]
    resources: [wasmplugins]
    verbs: [get, list, watch, create, patch, update]
  - apiGroups: [networking.istio.io]
    resources: [envoyfilters]
    verbs: [get, list, watch, create, patch, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aep-gateway-reconciler
  namespace: higress-system
subjects:
  - kind: ServiceAccount
    name: aep-gateway-reconciler
    namespace: aep-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aep-gateway-reconciler
