apiVersion: v1
kind: ServiceAccount
metadata:
  name: aep-gateway-reconciler
  namespace: aep-system
---
# The reconciler is granted only the Higress objects it owns. Its live
# server-side apply implementation is introduced with the data-plane E2E gate.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aep-gateway-reconciler
  namespace: higress-system
rules:
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch, create, patch, update]
  - apiGroups: [extensions.higress.io]
    resources: [wasmplugins]
    verbs: [get, list, watch, create, patch, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aep-gateway-reconciler
  namespace: higress-system
subjects:
  - kind: ServiceAccount
    name: aep-gateway-reconciler
    namespace: aep-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aep-gateway-reconciler
