# Requires external-secrets.io. Replace secretStoreRef and remoteRef keys for the
# selected cloud Secret manager; no Secret values belong in this repository.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aep-control-service-secrets
  namespace: aep-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: production-secrets
  target:
    name: aep-control-service-secrets
    creationPolicy: Owner
  data:
    - secretKey: database-url
      remoteRef: {key: aep/production/control-service/database-url}
    - secretKey: minio-access-key
      remoteRef: {key: aep/production/control-service/minio-access-key}
    - secretKey: minio-secret-key
      remoteRef: {key: aep/production/control-service/minio-secret-key}
    - secretKey: ed25519-seed
      remoteRef: {key: aep/production/control-service/ed25519-seed}
    - secretKey: credential-keyring
      remoteRef: {key: aep/production/control-service/credential-keyring}
    - secretKey: bootstrap-admin-password
      remoteRef: {key: aep/production/control-service/bootstrap-admin-password}
    - secretKey: reconciler-token
      remoteRef: {key: aep/production/data-plane/reconciler-token}
---
# Provider API keys stay in Secrets owned by the selected Secret manager. Routes
# reference only name/key/namespace, so the reconciler never receives their value.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aep-provider-credentials
  namespace: higress-system
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: production-secrets
  target:
    name: aep-provider-credentials
    creationPolicy: Owner
  dataFrom:
    - find:
        path: aep/production/providers/
