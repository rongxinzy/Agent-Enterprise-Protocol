apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aep-default-deny
  namespace: aep-system
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aep-control-service
  namespace: aep-system
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: aep-control-service}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: aep-gateway-authorizer}
        - podSelector:
            matchLabels: {app.kubernetes.io/name: aep-gateway-reconciler}
      ports: [{protocol: TCP, port: 8080}]
  egress:
    - to:
        - namespaceSelector: {}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        - ipBlock: {cidr: 0.0.0.0/0}
      ports: [{protocol: TCP, port: 443}, {protocol: TCP, port: 5432}, {protocol: TCP, port: 9000}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aep-gateway-authorizer
  namespace: aep-system
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: aep-gateway-authorizer}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: higress-system}
      ports: [{protocol: TCP, port: 8090}]
  egress:
    - to:
        - namespaceSelector: {}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: aep-control-service}
      ports: [{protocol: TCP, port: 8080}]
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: higress-system}
      ports: [{protocol: TCP, port: 80}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: aep-gateway-reconciler
  namespace: aep-system
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: aep-gateway-reconciler}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {}
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: aep-control-service}
      ports: [{protocol: TCP, port: 8080}]
    - to:
        - ipBlock: {cidr: 0.0.0.0/0}
      ports: [{protocol: TCP, port: 443}]
