# Opt-in alongside either gateway Operator or the legacy reconciler. Requires
# existing aep-system/aep-credentials namespaces and a separately provisioned
# aep-credential-publisher-config Secret; no private values belong in this tree.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aep-credential-publisher
  namespace: aep-system
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 0, maxUnavailable: 1}
  selector:
    matchLabels: {app.kubernetes.io/name: aep-credential-publisher}
  template:
    metadata:
      labels: {app.kubernetes.io/name: aep-credential-publisher}
    spec:
      serviceAccountName: aep-credential-publisher
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: publisher
          image: ko://github.com/rongxinzy/Agent-Enterprise-Protocol/services/control-service/cmd/credential-publisher
          env:
            - {name: AEP_ENVIRONMENT, value: production}
            - {name: AEP_CREDENTIAL_PUBLISHER_DEPLOYMENT_ID, value: deployment-enterprise-001}
            - {name: AEP_CREDENTIAL_PUBLISHER_INTERVAL, value: 5s}
            - {name: AEP_CREDENTIAL_PUBLISHER_DATABASE_URL_FILE, value: /var/run/publisher/database-url}
            - {name: AEP_CREDENTIAL_MASTER_KEY_FILE, value: /var/run/publisher/credential-keyring}
          ports: [{name: health, containerPort: 8095}]
          readinessProbe:
            httpGet: {path: /readyz, port: health}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: health}
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: publisher-config, mountPath: /var/run/publisher, readOnly: true}
      volumes:
        - name: publisher-config
          secret:
            secretName: aep-credential-publisher-config
            defaultMode: 0440
            items:
              - {key: database-url, path: database-url}
              - {key: credential-keyring, path: credential-keyring}
