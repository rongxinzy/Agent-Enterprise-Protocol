apiVersion: v1
kind: ServiceAccount
metadata:
  name: aep-access-policy-source
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aep-access-policy-source
rules:
  - apiGroups: ['']
    resources: [configmaps]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aep-access-policy-source
subjects:
  - kind: ServiceAccount
    name: aep-access-policy-source
    namespace: aep-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aep-access-policy-source
