apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: aep-workload-token-review
rules:
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: aep-workload-token-review
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: aep-workload-token-review
subjects:
  - kind: ServiceAccount
    name: authorino
    namespace: aep-system
