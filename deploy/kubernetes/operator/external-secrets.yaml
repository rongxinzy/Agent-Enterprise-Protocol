# ESO provisions infrastructure keys; DB publisher exclusively owns provider keys.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: aep-credential-publisher-config, namespace: aep-system}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: production-secrets}
  target: {name: aep-credential-publisher-config, creationPolicy: Owner}
  data:
    - secretKey: database-url
      remoteRef: {key: aep/production/credential-publisher/database-url}
    - secretKey: credential-keyring
      remoteRef: {key: aep/production/control-service/credential-keyring}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: aep-native-gateway, namespace: higress-system}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: production-secrets}
  target: {name: aep-native-gateway, creationPolicy: Owner}
  data:
    - secretKey: redis-password
      remoteRef: {key: aep/production/gateway/redis-password}
    - secretKey: quota-admin-key
      remoteRef: {key: aep/production/gateway/quota-admin-key}
