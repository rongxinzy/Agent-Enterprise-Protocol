apiVersion: v1
kind: ServiceAccount
metadata: {name: aep-credential-publisher, namespace: aep-system}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: aep-credential-publisher, namespace: aep-system}
spec:
  template:
    spec:
      automountServiceAccountToken: false
      containers:
        - name: publisher
          volumeMounts:
            - name: api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      volumes:
        - name: api-access
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken: {path: token, expirationSeconds: 3600}
              - configMap:
                  name: kube-root-ca.crt
                  items: [{key: ca.crt, path: ca.crt}]
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef: {fieldPath: metadata.namespace}
