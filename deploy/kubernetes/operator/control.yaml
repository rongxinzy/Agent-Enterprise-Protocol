apiVersion: v1
kind: ConfigMap
metadata: {name: aep-control-service-config, namespace: aep-system}
data:
  AEP_GATEWAY_PUBLICATIONS_ENABLED: "true"
  AEP_GATEWAY_OPERATOR_MODE: "true"
  AEP_GATEWAY_PUBLICATION_RELAY_ENABLED: "true"
  AEP_GATEWAY_PUBLICATION_NAMESPACE: aep-system
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: aep-control-service, namespace: aep-system}
spec:
  # No legacy/operator mixed-mode rolling window. Freeze ingress during handover.
  strategy:
    type: Recreate
  template:
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65532
      containers:
        - name: control-service
          volumeMounts:
            - name: api-access
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      volumes:
        - name: api-access
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken: {path: token, expirationSeconds: 3600}
              - configMap:
                  name: kube-root-ca.crt
                  items: [{key: ca.crt, path: ca.crt}]
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef: {fieldPath: metadata.namespace}
