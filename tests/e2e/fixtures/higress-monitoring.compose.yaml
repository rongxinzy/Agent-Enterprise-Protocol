# Isolated E2E collector only. Production reuses the cluster's existing stack.
services:
  prometheus:
    image: quay.io/prometheus/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=1h
    volumes:
      # Compose resolves paths relative to deploy/compose/compose.yaml.
      - ../../tests/e2e/fixtures/higress-prometheus.yaml:/etc/prometheus/prometheus.yml:ro
    tmpfs:
      - /prometheus:uid=65534,gid=65534
    ports:
      - "127.0.0.1:${AEP_PROMETHEUS_PORT:-19091}:9090"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
