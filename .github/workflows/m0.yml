name: AEP

on:
  pull_request:
  push:
    branches:
      - main
      - codex/m0-*
      - codex/m1-*
      - codex/m2-*
      - codex/m3-*

permissions:
  contents: read

jobs:
  sdk-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run openapi:lint
      - run: npm run openapi:build
      - name: Verify generated contract files
        run: git diff --exit-code -- openapi/dist/aep-v1-m0.bundle.yaml openapi/dist/aep-v1-m1.bundle.yaml openapi/dist/aep-v1-m2.bundle.yaml packages/aep-sdk-node/src/generated/aep-v1.ts
      - run: npm run release:audit
      - run: npm run test:release-artifacts
      - run: npm run license:boundary:check
      - run: npm run build --workspace @aep/sdk-node
      - run: npm run test --workspace @aep/sdk-node
      - run: npm run sdk:package:check

  control-service:
    needs: sdk-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.6
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          args: --timeout=5m
      - name: Format check (gofmt)
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo '::error::run gofmt -w on the files above'; exit 1; }
      - name: Coverage floor
        run: scripts/check-coverage.sh 80
      - run: go test -race ./...
      - run: go vet ./...
      - run: go build ./...

  example-agent:
    needs: sdk-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test --workspace @aep/example-node-agent

  compose-e2e:
    needs:
      - control-service
      - example-agent
    # Temporarily skipped: the compose stack cannot start because upstream
    # MinIO images were withdrawn (Docker Hub repos deleted, quay.io rejects
    # anonymous pulls). Re-enable by setting the repository variable
    # AEP_ENABLE_MINIO_E2E to 'true' once the image source is fixed.
    if: vars.AEP_ENABLE_MINIO_E2E == 'true'
    runs-on: ubuntu-latest
    env:
      GOPROXY: https://proxy.golang.org,direct
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.6
          cache: true
      - run: npm ci
      - run: npm run build
      - run: npm run test:e2e

  data-plane-kubernetes:
    needs:
      - control-service
      - example-agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.6
          cache: true
      - name: Install kind
        run: |
          mkdir -p "$RUNNER_TEMP/aep-bin"
          curl --fail --location --silent --show-error https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-amd64 -o "$RUNNER_TEMP/aep-bin/kind"
          echo "50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54  $RUNNER_TEMP/aep-bin/kind" | sha256sum --check
          chmod +x "$RUNNER_TEMP/aep-bin/kind"
          echo "$RUNNER_TEMP/aep-bin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm run test:e2e:m3-kubernetes

  backup-restore:
    needs:
      - control-service
      - example-agent
    # Temporarily skipped for the same MinIO image withdrawal as compose-e2e.
    # Re-enable by setting the repository variable AEP_ENABLE_MINIO_E2E to 'true'.
    if: vars.AEP_ENABLE_MINIO_E2E == 'true'
    runs-on: ubuntu-latest
    env:
      GOPROXY: https://proxy.golang.org,direct
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.6
          cache: true
      - run: npm ci
      - run: npm run test:e2e:backup-restore

  release-gate:
    needs:
      - sdk-gate
      - control-service
      - example-agent
      - compose-e2e
      - data-plane-kubernetes
      - backup-restore
    runs-on: ubuntu-latest
    steps:
      - run: echo "AEP 95% release gate passed."

  coverage-ratchet:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
          cache: true
      - name: Compare head vs base
        run: |
          measure() {
            rev="$1"
            git checkout --quiet "$rev"
            go test ./... -coverpkg=./... -coverprofile=/tmp/c.cov >/dev/null
            python3 scripts/merge-coverprofile.py /tmp/c.cov /tmp/c.merged
            go tool cover -func=/tmp/c.merged | awk '/^total:/ {sub(/%/, "", $3); print $3}'
          }
          base="$(git rev-parse origin/${{ github.base_ref }})"
          head_pct=$(measure HEAD)
          base_pct=$(measure "$base")
          echo "main=${base_pct}% PR=${head_pct}%"
          if awk "BEGIN{exit !($head_pct < $base_pct)}"; then
            echo "::error::coverage dropped from ${base_pct}% to ${head_pct}%"
            exit 1
          fi
