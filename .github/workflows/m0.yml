name: CI validation

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      e2e_plan: ${{ steps.e2e-plan.outputs.e2e_plan }}
      compose: ${{ steps.e2e-plan.outputs.compose }}
      kubernetes: ${{ steps.e2e-plan.outputs.kubernetes }}
      backup: ${{ steps.e2e-plan.outputs.backup }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Select E2E scenarios from the PR diff
        id: e2e-plan
        env:
          AEP_CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          AEP_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/e2e-plan.cjs

  source-lines:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: npm run check:source-lines

  sdk-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Dead code (JS/TS and Python)
        run: |
          python3 -m pip install --disable-pip-version-check ruff==0.9.6 vulture==2.14
          npm run deadcode:js
          npm run deadcode:py
      - run: npm run openapi:lint
      - run: npm run openapi:build
      - name: Verify generated contract files
        run: git diff --exit-code -- openapi/dist/aep-v1-m0.bundle.yaml openapi/dist/aep-v1-m1.bundle.yaml openapi/dist/aep-v1-m2.bundle.yaml packages/aep-sdk-node/src/generated/aep-v1.ts
      - run: npm run build --workspace @aep/sdk-node
      - run: npm run test --workspace @aep/sdk-node

  control-service:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: aep_ci
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U aep_ci -d postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.9
          cache: true
      - name: Dead code (Go)
        run: go run golang.org/x/tools/cmd/deadcode@v0.52.0 -test ./...
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          args: --timeout=5m
      - name: Format check (gofmt)
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo '::error::run gofmt -w on the files above'; exit 1; }
      - name: Verify generated operator manifests
        run: |
          bash services/gateway-operator/generate.sh
          git diff --exit-code -- services/gateway-operator/
      - uses: actions/cache@v4
        with:
          path: /tmp/envtest-assets
          key: envtest-v1.37.0-${{ runner.os }}
      - name: Install envtest binaries for the operator suite
        run: bash .github/ci-envtest-setup.sh
      - name: Go test (race), vet, build
        env:
          AEP_REFERENCE_TEST_DATABASE_URL: postgres://aep_ci:ci-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5432/postgres?sslmode=disable
        run: |
          go test ./... -race
          go vet ./...
          go build ./...

  example-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build --workspace @aep/sdk-node
      - run: npm run build --workspace @aep/example-node-agent
      - run: npm run test --workspace @aep/example-node-agent

  compose-e2e:
    if: ${{ needs.e2e-plan.outputs.compose == 'true' }}
    needs:
      - e2e-plan
      - sdk-gate
      - control-service
      - example-agent
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GOPROXY: https://proxy.golang.org,direct
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.9
          cache: true
      - run: npm ci
      - run: npm run build
      - name: Run selected Compose E2E scenarios
        env:
          AEP_E2E_PLAN: ${{ needs.e2e-plan.outputs.e2e_plan }}
        run: node .github/run-selected-e2e.cjs

  data-plane-kubernetes:
    if: ${{ needs.e2e-plan.outputs.kubernetes == 'true' }}
    needs:
      - e2e-plan
      - sdk-gate
      - control-service
      - example-agent
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.9
          cache: true
      - name: Install kind
        run: |
          mkdir -p "$RUNNER_TEMP/aep-bin"
          curl --fail --location --silent --show-error https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-amd64 -o "$RUNNER_TEMP/aep-bin/kind"
          echo "50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54  $RUNNER_TEMP/aep-bin/kind" | sha256sum --check
          chmod +x "$RUNNER_TEMP/aep-bin/kind"
          echo "$RUNNER_TEMP/aep-bin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm run test:e2e:m3-kubernetes

  backup-restore:
    if: ${{ needs.e2e-plan.outputs.backup == 'true' }}
    needs:
      - e2e-plan
      - sdk-gate
      - control-service
      - example-agent
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GOPROXY: https://proxy.golang.org,direct
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.9
          cache: true
      - run: npm ci
      - run: npm run test:e2e:backup-restore

  ci-gate:
    name: ci-gate
    if: ${{ always() }}
    needs:
      - e2e-plan
      - source-lines
      - sdk-gate
      - control-service
      - example-agent
      - compose-e2e
      - data-plane-kubernetes
      - backup-restore
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github
      - name: Fail on failed, cancelled or unexpectedly skipped checks
        env:
          AEP_CI_NEEDS: ${{ toJSON(needs) }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node .github/e2e-status.cjs
