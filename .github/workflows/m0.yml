name: AEP

on:
  pull_request:
  push:
    branches:
      - main
      - codex/m0-*
      - codex/m1-*

permissions:
  contents: read

jobs:
  sdk-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run openapi:lint
      - run: npm run openapi:build
      - name: Verify generated contract files
        run: git diff --exit-code -- openapi/dist/aep-v1-m0.bundle.yaml openapi/dist/aep-v1-m1.bundle.yaml packages/aep-sdk-node/src/generated/aep-v1.ts
      - run: npm run build --workspace @aep/sdk-node
      - run: npm run test --workspace @aep/sdk-node

  control-service:
    needs: sdk-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.x
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./...

  example-agent:
    needs: sdk-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test --workspace @aep/example-node-agent

  compose-e2e:
    needs:
      - control-service
      - example-agent
    runs-on: ubuntu-latest
    env:
      GOPROXY: https://proxy.golang.org,direct
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.x
          cache: true
      - run: npm ci
      - run: npm run build
      - run: npm run test:e2e
