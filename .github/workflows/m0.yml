name: CI validation

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Preserve the exact check name already required by main branch protection.
  # A reusable workflow would publish security / dependency-audit instead.
  dependency-audit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.9
          cache: true
      - run: npm ci
      - name: Audit production dependencies and reachable Go code
        run: npm run security:check

  codeql:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/codeql.yml
    permissions:
      contents: read
      security-events: write

  security:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      security-events: write

  gate-tests:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/devops-gate-tests.yml
    permissions:
      contents: read
      pull-requests: read
      actions: read

  ci-results:
    if: ${{ github.event_name == 'pull_request' && always() }}
    needs: [release-gate, dependency-audit, codeql, security, gate-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
          sparse-checkout: .github
      - name: Summarize all final results without polling
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: |
          node -e "const gate = require('./.github/ci-results.cjs'); const config = require('./.github/devops-ci.json'); gate.verifyNeeds(JSON.parse(process.env.CI_NEEDS), config.orchestrator.needs);"

  e2e-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      e2e_plan: ${{ steps.e2e-plan.outputs.e2e_plan }}
      compose: ${{ steps.e2e-plan.outputs.compose }}
      kubernetes: ${{ steps.e2e-plan.outputs.kubernetes }}
      backup: ${{ steps.e2e-plan.outputs.backup }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Test E2E selection policy
        run: node --test .github/e2e-plan.test.cjs
      - name: Select E2E scenarios from the complete PR diff
        id: e2e-plan
        env:
          AEP_CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          AEP_CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node .github/e2e-plan.cjs

  sdk-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run openapi:lint
      - run: npm run openapi:build
      - name: Verify generated contract files
        run: git diff --exit-code -- openapi/dist/aep-v1-m0.bundle.yaml openapi/dist/aep-v1-m1.bundle.yaml openapi/dist/aep-v1-m2.bundle.yaml packages/aep-sdk-node/src/generated/aep-v1.ts
      - run: npm run release:audit
      - run: npm run test:release-artifacts
      - run: npm run license:boundary:check
      - run: npm run build --workspace @aep/sdk-node
      - run: npm run test --workspace @aep/sdk-node
      - run: npm run sdk:package:check

  control-service:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.9
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          args: --timeout=5m
      - name: Format check (gofmt)
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo '::error::run gofmt -w on the files above'; exit 1; }
      - name: Verify generated operator manifests
        run: |
          bash services/gateway-operator/generate.sh
          git diff --exit-code -- services/gateway-operator/
      - uses: actions/cache@v4
        with:
          path: /tmp/envtest-assets
          key: envtest-v1.37.0-${{ runner.os }}
      - name: Install envtest binaries for the operator suite
        run: bash .github/ci-envtest-setup.sh
      - name: Go verify (race, coverage floor, vet, build)
        id: go-verify
        run: |
          coverprofile="$(mktemp -t cover.XXXXXX)"
          test_output="$(mktemp -t cover-test.XXXXXX)"
          if ! go test ./... -race -coverpkg=./... -coverprofile="$coverprofile" >"$test_output"; then
            cat "$test_output"
            exit 1
          fi
          head_pct="$(bash scripts/ci-go-coverage-pct.sh "$coverprofile")"
          echo "AEP go coverage: ${head_pct}% (floor 80%)"
          if awk "BEGIN{exit !($head_pct < 80)}"; then
            echo "::error::coverage ${head_pct}% is below the 80% floor"
            exit 1
          fi
          echo "$head_pct" > /tmp/go-head-coverage-pct.txt
          echo "head_pct=$head_pct" >> "$GITHUB_OUTPUT"
          go vet ./...
          go build ./...
      - name: Upload head coverage for ratchet
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: go-coverage-head
          path: /tmp/go-head-coverage-pct.txt
          retention-days: 1

  example-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test --workspace @aep/example-node-agent

  compose-e2e:
    if: ${{ needs.e2e-plan.outputs.compose == 'true' }}
    needs:
      - e2e-plan
      - sdk-gate
      - control-service
      - example-agent
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      GOPROXY: https://proxy.golang.org,direct
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.9
          cache: true
      - run: npm ci
      - run: npm run build
      - name: Run selected Compose E2E scenarios
        env:
          AEP_E2E_PLAN: ${{ needs.e2e-plan.outputs.e2e_plan }}
        run: node .github/run-selected-e2e.cjs

  data-plane-kubernetes:
    if: ${{ needs.e2e-plan.outputs.kubernetes == 'true' }}
    needs:
      - e2e-plan
      - sdk-gate
      - control-service
      - example-agent
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.9
          cache: true
      - name: Install kind
        run: |
          mkdir -p "$RUNNER_TEMP/aep-bin"
          curl --fail --location --silent --show-error https://kind.sigs.k8s.io/dl/v0.32.0/kind-linux-amd64 -o "$RUNNER_TEMP/aep-bin/kind"
          echo "50030de23cf40a18505f20426f6a8506bedf13c6e509244bd1fa9463721b0f54  $RUNNER_TEMP/aep-bin/kind" | sha256sum --check
          chmod +x "$RUNNER_TEMP/aep-bin/kind"
          echo "$RUNNER_TEMP/aep-bin" >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm run test:e2e:m3-kubernetes

  backup-restore:
    if: ${{ needs.e2e-plan.outputs.backup == 'true' }}
    needs:
      - e2e-plan
      - sdk-gate
      - control-service
      - example-agent
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      GOPROXY: https://proxy.golang.org,direct
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: 1.26.9
          cache: true
      - run: npm ci
      - run: npm run test:e2e:backup-restore

  release-gate:
    if: ${{ always() }}
    needs:
      - e2e-plan
      - sdk-gate
      - control-service
      - example-agent
      - compose-e2e
      - data-plane-kubernetes
      - backup-restore
      - coverage-ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: .github
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Fail on failed, cancelled or unexpectedly skipped checks
        env:
          AEP_CI_NEEDS: ${{ toJSON(needs) }}
        run: node .github/e2e-status.cjs

  coverage-ratchet:
    if: github.event_name == 'pull_request' && needs.control-service.result == 'success'
    needs: control-service
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.9"
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: go-coverage-head
      - name: Read head coverage from control-service
        id: head
        run: echo "pct=$(cat go-head-coverage-pct.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: /tmp/envtest-assets
          key: envtest-v1.37.0-${{ runner.os }}
      - name: Install envtest binaries for the operator suite
        run: bash .github/ci-envtest-setup.sh
      - name: Compare head vs base
        env:
          HEAD_PCT: ${{ steps.head.outputs.pct }}
        run: |
          measure() {
            rev="$1"
            git checkout --quiet "$rev"
            go test ./... -coverpkg=./... -coverprofile=/tmp/c.cov >/dev/null
            bash scripts/ci-go-coverage-pct.sh /tmp/c.cov
          }
          base="$(git rev-parse origin/${{ github.base_ref }})"
          head_pct="$HEAD_PCT"
          base_pct=$(measure "$base")
          echo "main=${base_pct}% PR=${head_pct}%"
          if awk "BEGIN{exit !($head_pct < $base_pct)}"; then
            echo "::error::coverage dropped from ${base_pct}% to ${head_pct}%"
            exit 1
          fi
