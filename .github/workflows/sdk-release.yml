name: AEP Node SDK release

on:
  push:
    tags:
      - sdk-node-v*

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify tag matches package version
        run: |
          sdk_version="$(node -p "require('./packages/aep-sdk-node/package.json').version")"
          test "$GITHUB_REF_NAME" = "sdk-node-v$sdk_version"
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: npm run openapi:build
      - run: npm run test --workspace @aep/sdk-node
      - run: npm run sdk:package:check -- --output-dir release/sdk
      - name: Publish versioned SDK archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/sdk/* \
            --verify-tag \
            --title "AEP Node SDK ${GITHUB_REF_NAME#sdk-node-v}" \
            --generate-notes
