# Explicit opt-in only; not included by the default operator deployment.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gateway-access-operator
subjects:
  - kind: ServiceAccount
    name: aep-gateway-operator
    namespace: aep-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gateway-access-operator-role
