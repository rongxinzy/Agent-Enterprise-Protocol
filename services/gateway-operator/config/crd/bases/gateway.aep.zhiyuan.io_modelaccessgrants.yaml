---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: modelaccessgrants.gateway.aep.zhiyuan.io
spec:
  group: gateway.aep.zhiyuan.io
  names:
    kind: ModelAccessGrant
    listKind: ModelAccessGrantList
    plural: modelaccessgrants
    singular: modelaccessgrant
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.subject.id
      name: Subject
      type: string
    - jsonPath: .spec.disabled
      name: Disabled
      type: boolean
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ModelAccessGrant is a derived authorization projection, never
          RBAC's source.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ModelAccessGrantSpec is the immutable, versioned output of DB authorization.
              One resource covers one subject binding; a role change republishes only the
              affected resources. The ModelPolicy quota contract remains independent.
            properties:
              binding:
                description: ModelAccessBinding scopes a derived grant to one session
                  or workload.
                properties:
                  kind:
                    enum:
                    - session
                    - kubernetes
                    type: string
                  sessionId:
                    maxLength: 256
                    minLength: 1
                    type: string
                  workload:
                    description: |-
                      ModelAccessWorkload binds one employee to its dedicated ServiceAccount UID.
                      Identity must be established by a trusted Kubernetes token or mTLS verifier;
                      none of these declarations authenticate a request by themselves.
                    properties:
                      audience:
                        maxLength: 256
                        minLength: 1
                        type: string
                      employeeUid:
                        description: EmployeeUID fences deletion and recreation of
                          a DigitalEmployee.
                        maxLength: 128
                        minLength: 1
                        type: string
                      namespace:
                        maxLength: 63
                        minLength: 1
                        type: string
                      serviceAccountName:
                        maxLength: 253
                        minLength: 1
                        type: string
                      serviceAccountUid:
                        description: |-
                          UID is a type that holds unique ID values, including UUIDs.  Because we
                          don't ONLY use UUIDs, this is an alias to string.  Being a type captures
                          intent and helps make sure that UIDs and names do not get conflated.
                        maxLength: 128
                        minLength: 1
                        type: string
                    required:
                    - audience
                    - employeeUid
                    - namespace
                    - serviceAccountName
                    - serviceAccountUid
                    type: object
                required:
                - kind
                type: object
                x-kubernetes-validations:
                - message: binding requires exactly its session or workload identity
                  rule: 'self.kind == ''session'' ? (has(self.sessionId) && !has(self.workload))
                    : (has(self.workload) && !has(self.sessionId))'
              deploymentId:
                maxLength: 80
                minLength: 1
                type: string
              disabled:
                type: boolean
              issuedAt:
                description: |-
                  IssuedAt/ValidUntil bound propagation failures independently of token exp.
                  Expired publications must deny even when a complete result is cached.
                format: date-time
                type: string
              licenses:
                description: |-
                  Licenses contains only current accepted ID/digest pairs for this deployment.
                  A different active license must never satisfy an entitlement token's binding.
                items:
                  description: |-
                    ModelAccessLicense is an exact accepted entitlement binding, not a signed
                    license or private key. Human verification checks JWT issuer/audience/use/time
                    and matches BOTH license ID and digest; workload attestations reference the
                    same exact pair. Empty/omitted bindings never waive deployment entitlement.
                  properties:
                    digest:
                      pattern: ^sha256:[0-9a-f]{64}$
                      type: string
                    id:
                      maxLength: 256
                      minLength: 1
                      type: string
                    validUntil:
                      description: |-
                        ValidUntil is the existing license grace boundary; absent means perpetual.
                        Check it per request even when a complete authorization result is cached.
                      format: date-time
                      type: string
                  required:
                  - digest
                  - id
                  type: object
                maxItems: 64
                type: array
                x-kubernetes-list-map-keys:
                - id
                x-kubernetes-list-type: map
              models:
                description: Models is the effective role-derived AEP model allow-set.
                  Empty denies all.
                items:
                  maxLength: 40
                  minLength: 1
                  pattern: ^[a-z0-9][a-z0-9-]*$
                  type: string
                maxItems: 512
                type: array
                x-kubernetes-list-type: set
              publication:
                description: |-
                  PublicationReference correlates conditions with an immutable relay intent.
                  It contains no credentials, snapshot payload or data-plane readiness proof.
                properties:
                  contentHash:
                    pattern: ^[a-f0-9]{64}$
                    type: string
                  operationId:
                    pattern: ^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$
                    type: string
                  revision:
                    maxLength: 200
                    minLength: 1
                    type: string
                  sequence:
                    format: int64
                    minimum: 1
                    type: integer
                required:
                - contentHash
                - operationId
                - revision
                - sequence
                type: object
              roleIds:
                description: RoleIDs and TeamIDs preserve trusted quota/observability
                  membership only.
                items:
                  maxLength: 256
                  minLength: 1
                  type: string
                maxItems: 256
                type: array
                x-kubernetes-list-type: set
              subject:
                description: |-
                  ModelAccessSubject identifies an AEP account, including kind=agent accounts.
                  These are derived effective grants, never direct user/team assignments.
                properties:
                  id:
                    description: ID is users.id, not a username, owner ID, Pod name
                      or caller header.
                    maxLength: 256
                    minLength: 1
                    type: string
                  kind:
                    enum:
                    - human
                    - agent
                    type: string
                required:
                - id
                - kind
                type: object
              teamIds:
                items:
                  maxLength: 256
                  minLength: 1
                  type: string
                maxItems: 256
                type: array
                x-kubernetes-list-type: set
              validUntil:
                format: date-time
                type: string
              workloadEntitlement:
                description: |-
                  WorkloadEntitlement is an explicit trusted license-feature attestation.
                  Its absence never waives a deployment-wide entitlement requirement.
                properties:
                  feature:
                    description: |-
                      The writer must derive this from verified license features, never infer it
                      from the existence of an active license or from the ServiceAccount token.
                    enum:
                    - enterprise.models
                    maxLength: 17
                    type: string
                  licenseDigest:
                    maxLength: 71
                    pattern: ^sha256:[0-9a-f]{64}$
                    type: string
                  licenseId:
                    maxLength: 256
                    minLength: 1
                    type: string
                required:
                - feature
                - licenseDigest
                - licenseId
                type: object
              workloadPodUids:
                description: |-
                  WorkloadPodUIDs is mutable live-Pod evidence, outside the immutable binding.
                  Missing/empty denies workload requests, including cached TokenReview results.
                  It is not a model grant and must be supplied by a trusted lifecycle observer.
                items:
                  maxLength: 128
                  minLength: 1
                  pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
                  type: string
                maxItems: 512
                type: array
                x-kubernetes-list-type: set
            required:
            - binding
            - deploymentId
            - disabled
            - issuedAt
            - models
            - publication
            - subject
            - validUntil
            type: object
            x-kubernetes-validations:
            - message: deployment, subject and binding are immutable
              rule: self.deploymentId == oldSelf.deploymentId && self.subject == oldSelf.subject
                && self.binding == oldSelf.binding
            - message: changed grants require a newer publication; replay and same-version
                mutation are forbidden
              rule: self.publication.sequence > oldSelf.publication.sequence || self
                == oldSelf
            - message: human subjects require an AEP session binding
              rule: self.subject.kind == 'agent' || self.binding.kind == 'session'
            - message: publication validity must be positive and at most one hour
              rule: self.validUntil > self.issuedAt && self.validUntil <= self.issuedAt
                + duration('1h')
            - message: disabled tombstones cannot carry allowed models
              rule: '!self.disabled || size(self.models) == 0'
            - message: Pod observations require a Kubernetes workload binding
              rule: '!has(self.workloadPodUids) || self.binding.kind == ''kubernetes'''
            - message: workload entitlement requires its exact accepted license and
                a Kubernetes binding
              rule: '!has(self.workloadEntitlement) || (self.binding.kind == ''kubernetes''
                && has(self.licenses) && self.licenses.exists(l, l.id == self.workloadEntitlement.licenseId
                && l.digest == self.workloadEntitlement.licenseDigest))'
          status:
            description: |-
              ModelAccessGrantStatus separates spec acceptance, resource writes and serving
              adoption. Only independently observed, current serving replicas prove Ready.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 8
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                format: int64
                type: integer
              observedPublication:
                description: |-
                  PublicationReference correlates conditions with an immutable relay intent.
                  It contains no credentials, snapshot payload or data-plane readiness proof.
                properties:
                  contentHash:
                    pattern: ^[a-f0-9]{64}$
                    type: string
                  operationId:
                    pattern: ^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$
                    type: string
                  revision:
                    maxLength: 200
                    minLength: 1
                    type: string
                  sequence:
                    format: int64
                    minimum: 1
                    type: integer
                required:
                - contentHash
                - operationId
                - revision
                - sequence
                type: object
              replicas:
                items:
                  description: |-
                    ModelAccessReplicaObservation is data-plane evidence for one serving process.
                    Ready/Lease leadership and an API apply response are not adoption evidence.
                  properties:
                    instanceId:
                      description: InstanceID identifies a process incarnation, including
                        in-place restarts.
                      maxLength: 128
                      minLength: 1
                      type: string
                    observedAt:
                      format: date-time
                      type: string
                    podUid:
                      description: |-
                        UID is a type that holds unique ID values, including UUIDs.  Because we
                        don't ONLY use UUIDs, this is an alias to string.  Being a type captures
                        intent and helps make sure that UIDs and names do not get conflated.
                      maxLength: 128
                      minLength: 1
                      type: string
                    publication:
                      description: |-
                        PublicationReference correlates conditions with an immutable relay intent.
                        It contains no credentials, snapshot payload or data-plane readiness proof.
                      properties:
                        contentHash:
                          pattern: ^[a-f0-9]{64}$
                          type: string
                        operationId:
                          pattern: ^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$
                          type: string
                        revision:
                          maxLength: 200
                          minLength: 1
                          type: string
                        sequence:
                          format: int64
                          minimum: 1
                          type: integer
                      required:
                      - contentHash
                      - operationId
                      - revision
                      - sequence
                      type: object
                  required:
                  - instanceId
                  - observedAt
                  - podUid
                  - publication
                  type: object
                maxItems: 64
                type: array
                x-kubernetes-list-map-keys:
                - podUid
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
