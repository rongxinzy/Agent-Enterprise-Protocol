---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: modelpolicies.gateway.aep.zhiyuan.io
spec:
  group: gateway.aep.zhiyuan.io
  names:
    kind: ModelPolicy
    listKind: ModelPolicyList
    plural: modelpolicies
    singular: modelpolicy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.targetRef.name
      name: Target
      type: string
    - jsonPath: .status.conditions[?(@.type=='Accepted')].status
      name: Accepted
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ModelPolicy is native rate limiting and quota intent for a model
          or deployment.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ModelPolicySpec holds native rules for one model or the whole
              deployment.
            properties:
              disabled:
                description: Disabled retains a publication fence while rendering
                  no native rule.
                type: boolean
              nativeRule:
                description: NativeRule preserves the business rule identity/version
                  used by Higress.
                properties:
                  id:
                    pattern: ^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$
                    type: string
                  version:
                    format: int64
                    minimum: 1
                    type: integer
                required:
                - id
                - version
                type: object
              quota:
                description: Quota caps total consumption for the policy target over
                  an interval.
                properties:
                  intervalSeconds:
                    description: IntervalSeconds is the window length in seconds.
                    enum:
                    - 1
                    - 60
                    - 3600
                    - 86400
                    format: int64
                    type: integer
                  maximum:
                    description: Maximum is consumption in Unit per interval.
                    format: int64
                    maximum: 1000000000000
                    minimum: 1
                    type: integer
                  unit:
                    default: requests
                    description: Unit is explicit; existing request quotas never silently
                      become tokens.
                    enum:
                    - requests
                    - tokens
                    type: string
                required:
                - intervalSeconds
                - maximum
                type: object
              rateLimits:
                items:
                  description: RateLimit caps requests per interval for the policy
                    target.
                  properties:
                    intervalSeconds:
                      description: IntervalSeconds is the window length in seconds.
                      enum:
                      - 1
                      - 60
                      - 3600
                      - 86400
                      format: int64
                      type: integer
                    maximum:
                      description: Maximum is the number of requests allowed per interval.
                      format: int64
                      maximum: 1000000000000
                      minimum: 1
                      type: integer
                  required:
                  - intervalSeconds
                  - maximum
                  type: object
                maxItems: 32
                type: array
              subject:
                description: |-
                  Subject defaults to model or global according to the target. User/team/role
                  subjects use trusted AEP membership headers, optionally intersected by model.
                properties:
                  id:
                    maxLength: 256
                    minLength: 1
                    type: string
                  type:
                    enum:
                    - model
                    - global
                    - user
                    - team
                    - role
                    type: string
                required:
                - type
                type: object
                x-kubernetes-validations:
                - message: user/team/role subjects require an id; model/global subjects
                    must omit it
                  rule: 'self.type in [''model'',''global''] ? !has(self.id) : has(self.id)'
              targetRef:
                description: PolicyTargetReference selects one model or deployment-wide
                  policy scope.
                properties:
                  kind:
                    description: Kind selects one model or the whole deployment.
                    enum:
                    - ModelRoute
                    - DeploymentConfig
                    type: string
                  name:
                    description: Name is the target in the same namespace; deployments
                      use "deployment".
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - kind
                - name
                type: object
            required:
            - targetRef
            type: object
            x-kubernetes-validations:
            - message: deployment target must name deployment
              rule: self.targetRef.kind != 'DeploymentConfig' || self.targetRef.name
                == 'deployment'
            - message: model subjects require a model target
              rule: '!has(self.subject) || self.subject.type != ''model'' || self.targetRef.kind
                == ''ModelRoute'''
            - message: native rule identity requires exactly one quota
              rule: '!has(self.nativeRule) || (has(self.quota) && (!has(self.rateLimits)
                || size(self.rateLimits) == 0))'
          status:
            description: ModelPolicyStatus carries the operator's observations for
              one ModelPolicy.
            properties:
              appliedSnapshot:
                type: string
              conditions:
                description: |-
                  Conditions report semantic acceptance, aggregate application and
                  independent data-plane readiness.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                description: |-
                  ObservedGeneration is the metadata.generation the operator last
                  reconciled.
                format: int64
                type: integer
              observedPublication:
                description: |-
                  PublicationReference correlates conditions with an immutable relay intent.
                  It contains no credentials, snapshot payload or data-plane readiness proof.
                properties:
                  contentHash:
                    pattern: ^[a-f0-9]{64}$
                    type: string
                  operationId:
                    pattern: ^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$
                    type: string
                  revision:
                    maxLength: 200
                    minLength: 1
                    type: string
                  sequence:
                    format: int64
                    minimum: 1
                    type: integer
                required:
                - contentHash
                - operationId
                - revision
                - sequence
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
