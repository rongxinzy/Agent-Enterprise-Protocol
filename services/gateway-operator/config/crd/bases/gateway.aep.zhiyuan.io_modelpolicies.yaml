                - type
                type: object
                x-kubernetes-validations:
                - message: user/team/role subjects require an id; model subjects must
                    omit it
                  rule: 'self.type == ''model'' ? !has(self.id) : has(self.id)'
              targetRef:
                description: |-
                  PolicyTargetReference selects the ModelRoute a ModelPolicy applies to. Only
                  ModelRoute targets exist at the pilot stage.
                properties:
                  kind:
                    description: Kind is the target resource kind; only ModelRoute
                      is supported.
                    enum:
                    - ModelRoute
                    type: string
                  name:
                    description: Name is the target ModelRoute name in the same namespace.
                    maxLength: 253
                    minLength: 1
                    type: string
                required:
                - kind
                - name
                type: object
            required:
            - targetRef
            type: object
          status:
