kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: modelpolicies.gateway.aep.zhiyuan.io
spec:
  group: gateway.aep.zhiyuan.io
  names:
    kind: ModelPolicy
    listKind: ModelPolicyList
    plural: modelpolicies
    singular: modelpolicy
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.targetRef.name
      name: Target
      type: string
    - jsonPath: .status.conditions[?(@.type=='Accepted')].status
      name: Accepted
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ModelPolicy is rate limiting and quota intent bound to one ModelRoute.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: ModelPolicySpec holds rate limiting and quota intent for
              one ModelRoute.
            properties:
              quota:
                description: Quota caps total consumption for the policy target over
                  an interval.
                properties:
                  intervalSeconds:
                    description: IntervalSeconds is the window length in seconds.
                    enum:
                    - 1
                    - 60
                    - 3600
                    - 86400
                    format: int64
                    type: integer
                  maximum:
                    description: Maximum is consumption in Unit per interval.
                    format: int64
                    maximum: 1000000000000
                    minimum: 1
                    type: integer
                  unit:
                    default: requests
                    description: Unit is explicit; existing request quotas never silently
                      become tokens.
                    enum:
                    - requests
                    - tokens
                    type: string
                required:
                - intervalSeconds
                - maximum
                type: object
              rateLimits:
                items:
                  description: RateLimit caps requests per interval for the policy
                    target.
                  properties:
                    intervalSeconds:
                      description: IntervalSeconds is the window length in seconds.
                      enum:
                      - 1
                      - 60
                      - 3600
                      - 86400
                      format: int64
                      type: integer
                    maximum:
                      description: Maximum is the number of requests allowed per interval.
                      format: int64
                      maximum: 1000000000000
                      minimum: 1
                      type: integer
                  required:
                  - intervalSeconds
                  - maximum
                  type: object
                maxItems: 32
                type: array
              subject:
                description: |-
                  Subject defaults to the target model. User/team/role subjects are intersected
                  with that model, preserving AEP's composite membership header semantics.
                properties:
                  id:
                    maxLength: 256
                    minLength: 1
                    type: string
                  type:
                    enum:
                    - model
                    - user
                    - team
                    - role
                    type: string
