version: '2'
sql:
  - engine: postgresql
    schema: services/control-service/internal/db/schema.sql
    queries: services/control-service/internal/db/queries.sql
    gen:
      go:
        package: db
        out: services/control-service/internal/db/generated
        sql_package: pgx/v5
        emit_json_tags: true
        emit_empty_slices: true
