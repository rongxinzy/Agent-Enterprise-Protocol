openapi: 3.1.0
info:
  title: Agent Enterprise Protocol M2
  version: 1.0.0-m2
  description: >-
    M2 contract for Credential delivery plus the M0 and M1 capabilities. Except for
    metadata discovery, AEP v1 operations require X-AEP-Protocol-Version 1.0 and
    return RFC 9457 status 426 for missing or unsupported versions. federated_auth
    is advertised only when a federated adapter is enabled; mock OIDC is forbidden
    in production.
  license: {name: Apache 2.0, identifier: Apache-2.0}
servers:
  - url: http://localhost:8080
    description: Local M2 deployment
  - url: https://enterprise.example.com
    description: Protected deployment
security:
  - bearerAuth: []
tags:
  - {name: Service}
  - {name: Authentication}
  - {name: User Runtime}
  - {name: User Control Events}
  - {name: Admin Users}
  - {name: Admin Agents}
  - {name: Admin Identity}
  - {name: Admin Data Scope}
  - {name: Admin Skills}
  - {name: Admin Control Events}
  - {name: Admin Models}
  - {name: Admin Credentials}
  - {name: Admin Data Plane}
  - {name: Admin Deployment}
  - {name: Admin Model Gateway}
paths:
  /.well-known/jwks.json:
    get:
      tags: [Service]
      operationId: getJsonWebKeySet
      security: []
      responses:
        '200':
          description: Public keys used to validate AEP and model access tokens
          content:
            application/json:
              schema: {$ref: '#/components/schemas/JsonWebKeySet'}
  /aep/v1/metadata:
    get:
      tags: [Service]
      operationId: getMetadata
      security: []
      responses:
        '200':
          description: M2 service metadata and implemented capabilities
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ServiceMetadata'}
  /aep/v1/auth/methods:
    $ref: './aep-v1-authentication.openapi.yaml#/paths/~1auth~1methods'
  /aep/v1/auth/password/login:
    $ref: './aep-v1-authentication.openapi.yaml#/paths/~1auth~1password~1login'
  /aep/v1/auth/password/change:
    post:
      tags: [Authentication]
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasswordChangeRequest'}
      responses:
        '200':
          description: Rotated AEP session
          content:
            application/json:
              schema: {$ref: './aep-v1-authentication.openapi.yaml#/components/schemas/TokenResponse'}
        '400': {$ref: './aep-v1-authentication.openapi.yaml#/components/responses/Problem'}
        '401': {$ref: './aep-v1-authentication.openapi.yaml#/components/responses/Problem'}
  /aep/v1/auth/federated/start:
    $ref: './aep-v1-authentication.openapi.yaml#/paths/~1auth~1federated~1start'
  /aep/v1/auth/exchange:
    $ref: './aep-v1-authentication.openapi.yaml#/paths/~1auth~1exchange'
  /aep/v1/auth/refresh:
    $ref: './aep-v1-authentication.openapi.yaml#/paths/~1auth~1refresh'
  /aep/v1/auth/logout:
    $ref: './aep-v1-authentication.openapi.yaml#/paths/~1auth~1logout'
  /aep/v1/user/activation:
    $ref: './aep-v1-authentication.openapi.yaml#/paths/~1user~1activation'
  /aep/v1/user/me:
    $ref: './aep-v1.openapi.yaml#/paths/~1user~1me'
  /aep/v1/user/heartbeat:
    $ref: './aep-v1-control-events.openapi.yaml#/paths/~1user~1heartbeat'
  /aep/v1/user/control-events:
    $ref: './aep-v1-control-events.openapi.yaml#/paths/~1user~1control-events'
  /aep/v1/user/control-events/{deliveryId}/acknowledge:
    $ref: './aep-v1-control-events.openapi.yaml#/paths/~1user~1control-events~1{deliveryId}~1acknowledge'
  /aep/v1/user/control-events/{deliveryId}/result:
    $ref: './aep-v1-control-events.openapi.yaml#/paths/~1user~1control-events~1{deliveryId}~1result'
  /aep/v1/user/skills/manifest:
    $ref: './aep-v1.openapi.yaml#/paths/~1user~1skills~1manifest'
  /aep/v1/user/skills/{skillId}/versions/{version}/package:
    $ref: './aep-v1.openapi.yaml#/paths/~1user~1skills~1{skillId}~1versions~1{version}~1package'
  /aep/v1/user/skills/sync-results:
    $ref: './aep-v1.openapi.yaml#/paths/~1user~1skills~1sync-results'
  /aep/v1/user/events/batch:
    $ref: './aep-v1.openapi.yaml#/paths/~1user~1events~1batch'
  /aep/v1/user/credentials:
    $ref: './aep-v1.openapi.yaml#/paths/~1user~1credentials'
  /aep/v1/user/credentials/{credentialId}/resolve:
    $ref: './aep-v1.openapi.yaml#/paths/~1user~1credentials~1{credentialId}~1resolve'
  /aep/v1/user/models:
    $ref: './aep-v1.openapi.yaml#/paths/~1user~1models'
  /aep/v1/admin/users:
    $ref: './aep-v1-authentication.openapi.yaml#/paths/~1admin~1users'
  /aep/v1/admin/users/import:
    $ref: './aep-v1-authentication.openapi.yaml#/paths/~1admin~1users~1import'
  /aep/v1/admin/users/{userId}:
    $ref: './aep-v1-authentication.openapi.yaml#/paths/~1admin~1users~1{userId}'
  /aep/v1/admin/users/{userId}/reset-password:
    $ref: './aep-v1-authentication.openapi.yaml#/paths/~1admin~1users~1{userId}~1reset-password'
  /aep/v1/admin/permissions:
    $ref: './aep-v1-authentication.openapi.yaml#/paths/~1admin~1permissions'
  /aep/v1/admin/roles:
    $ref: './aep-v1-authentication.openapi.yaml#/paths/~1admin~1roles'
  /aep/v1/admin/roles/{roleId}:
    $ref: './aep-v1-authentication.openapi.yaml#/paths/~1admin~1roles~1{roleId}'
  /aep/v1/admin/teams:
    $ref: './aep-v1-authentication.openapi.yaml#/paths/~1admin~1teams'
  /aep/v1/admin/teams/{teamId}:
    $ref: './aep-v1-authentication.openapi.yaml#/paths/~1admin~1teams~1{teamId}'
  /aep/v1/admin/users/{userId}/rbac:
    $ref: './aep-v1-authentication.openapi.yaml#/paths/~1admin~1users~1{userId}~1rbac'
  /aep/v1/admin/sessions:
    get:
      tags: [Admin Users]
      operationId: listUserSessions
      security: [{bearerAuth: []}]
      parameters:
        - name: userId
          in: query
          schema: {type: string}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 50}
      responses:
        '200':
          description: User session page
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [sessionId, userId, topic, createdAt, lastSeenAt]
                      properties:
                        sessionId: {type: string}
                        userId: {type: string}
                        topic: {type: string}
                        createdAt: {type: string, format: date-time}
                        lastSeenAt: {type: string, format: date-time}
                        revokedAt: {type: [string, 'null'], format: date-time}
                        client:
                          description: >-
                            Client identity recorded when the session was issued
                            (self-reported or derived from User-Agent), or null
                            when no identity is known.
                          oneOf:
                            - {$ref: './aep-v1-authentication.openapi.yaml#/components/schemas/ClientIdentity'}
                            - {type: 'null'}
                  nextCursor: {type: [string, 'null']}
        '401': {$ref: './aep-v1-authentication.openapi.yaml#/components/responses/Problem'}
        '403': {$ref: './aep-v1-authentication.openapi.yaml#/components/responses/Problem'}
  /aep/v1/admin/sessions/{sessionId}/revoke:
    post:
      tags: [Admin Users]
      operationId: revokeUserSession
      security: [{bearerAuth: []}]
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
      responses:
        '204': {description: Session revoked}
        '401': {$ref: './aep-v1-authentication.openapi.yaml#/components/responses/Problem'}
        '403': {$ref: './aep-v1-authentication.openapi.yaml#/components/responses/Problem'}
        '404': {$ref: './aep-v1-authentication.openapi.yaml#/components/responses/Problem'}
  /aep/v1/admin/agents:
    $ref: './aep-v1-authentication.openapi.yaml#/paths/~1admin~1agents'
  /aep/v1/admin/agents/{agentId}:
    $ref: './aep-v1-authentication.openapi.yaml#/paths/~1admin~1agents~1{agentId}'
  /aep/v1/admin/agents/{agentId}/profile:
    $ref: './aep-v1-authentication.openapi.yaml#/paths/~1admin~1agents~1{agentId}~1profile'
  /aep/v1/admin/identity-sources:
    $ref: './aep-v1-authentication.openapi.yaml#/paths/~1admin~1identity-sources'
  /aep/v1/admin/identity-sources/{sourceId}/mappings:
    $ref: './aep-v1-authentication.openapi.yaml#/paths/~1admin~1identity-sources~1{sourceId}~1mappings'
  /aep/v1/admin/identity-sources/{sourceId}/mappings/{subjectType}/{externalId}:
    $ref: './aep-v1-authentication.openapi.yaml#/paths/~1admin~1identity-sources~1{sourceId}~1mappings~1{subjectType}~1{externalId}'
  /aep/v1/admin/data-scope-rules:
    $ref: './aep-v1-authentication.openapi.yaml#/paths/~1admin~1data-scope-rules'
  /aep/v1/admin/data-scope-rules/{ruleId}:
    $ref: './aep-v1-authentication.openapi.yaml#/paths/~1admin~1data-scope-rules~1{ruleId}'
  /aep/v1/admin/data-scope/context:
    $ref: './aep-v1-authentication.openapi.yaml#/paths/~1admin~1data-scope~1context'
  /aep/v1/admin/skills:
    $ref: './aep-v1.openapi.yaml#/paths/~1admin~1skills'
  /aep/v1/admin/skills/{skillId}:
    $ref: './aep-v1.openapi.yaml#/paths/~1admin~1skills~1{skillId}'
  /aep/v1/admin/skills/{skillId}/versions:
    $ref: './aep-v1.openapi.yaml#/paths/~1admin~1skills~1{skillId}~1versions'
  /aep/v1/admin/skills/{skillId}/versions/{version}/publish:
    $ref: './aep-v1.openapi.yaml#/paths/~1admin~1skills~1{skillId}~1versions~1{version}~1publish'
  /aep/v1/admin/skills/{skillId}/versions/{version}:
    $ref: './aep-v1.openapi.yaml#/paths/~1admin~1skills~1{skillId}~1versions~1{version}'
  /aep/v1/admin/skill-assignments:
    $ref: './aep-v1.openapi.yaml#/paths/~1admin~1skill-assignments'
  /aep/v1/admin/skill-assignments/{assignmentId}:
    $ref: './aep-v1.openapi.yaml#/paths/~1admin~1skill-assignments~1{assignmentId}'
  /aep/v1/admin/control-events:
    $ref: './aep-v1-control-events.openapi.yaml#/paths/~1admin~1control-events'
  /aep/v1/admin/control-events/{eventId}:
    $ref: './aep-v1-control-events.openapi.yaml#/paths/~1admin~1control-events~1{eventId}'
  /aep/v1/admin/control-events/{eventId}/cancel:
    $ref: './aep-v1-control-events.openapi.yaml#/paths/~1admin~1control-events~1{eventId}~1cancel'
  /aep/v1/admin/control-events/{eventId}/deliveries:
    $ref: './aep-v1-control-events.openapi.yaml#/paths/~1admin~1control-events~1{eventId}~1deliveries'
  /aep/v1/admin/licenses:
    $ref: './aep-v1.openapi.yaml#/paths/~1admin~1licenses'
  /aep/v1/admin/licenses/{licenseId}:
    $ref: './aep-v1.openapi.yaml#/paths/~1admin~1licenses~1{licenseId}'
  /aep/v1/admin/licenses/import:
    $ref: './aep-v1.openapi.yaml#/paths/~1admin~1licenses~1import'
  /aep/v1/admin/licenses/{licenseId}/revoke:
    $ref: './aep-v1.openapi.yaml#/paths/~1admin~1licenses~1{licenseId}~1revoke'
  /aep/v1/admin/events:
    $ref: './aep-v1.openapi.yaml#/paths/~1admin~1events'
  /aep/v1/admin/audit/authentication:
    $ref: './aep-v1.openapi.yaml#/paths/~1admin~1audit~1authentication'
  /aep/v1/admin/credentials:
    $ref: './aep-v1.openapi.yaml#/paths/~1admin~1credentials'
  /aep/v1/admin/credentials/{credentialId}:
    $ref: './aep-v1.openapi.yaml#/paths/~1admin~1credentials~1{credentialId}'
  /aep/v1/admin/credentials/{credentialId}/rotate:
    $ref: './aep-v1.openapi.yaml#/paths/~1admin~1credentials~1{credentialId}~1rotate'
  /aep/v1/admin/credential-assignments:
    $ref: './aep-v1.openapi.yaml#/paths/~1admin~1credential-assignments'
  /aep/v1/admin/credential-assignments/{assignmentId}:
    $ref: './aep-v1.openapi.yaml#/paths/~1admin~1credential-assignments~1{assignmentId}'
  /aep/v1/admin/models:
    $ref: './aep-v1.openapi.yaml#/paths/~1admin~1models'
  /aep/v1/admin/models/{modelId}:
    $ref: './aep-v1.openapi.yaml#/paths/~1admin~1models~1{modelId}'
  /aep/v1/admin/model-assignments:
    $ref: './aep-v1.openapi.yaml#/paths/~1admin~1model-assignments'
  /aep/v1/admin/model-assignments/{assignmentId}:
    $ref: './aep-v1.openapi.yaml#/paths/~1admin~1model-assignments~1{assignmentId}'
  /aep/v1/admin/model-gateway/capabilities:
    $ref: './aep-v1-gateway.openapi.yaml#/paths/~1aep~1v1~1admin~1model-gateway~1capabilities'
  /aep/v1/admin/model-gateway/metrics:
    $ref: './aep-v1-gateway.openapi.yaml#/paths/~1aep~1v1~1admin~1model-gateway~1metrics'
  /aep/v1/admin/model-gateway/health:
    $ref: './aep-v1-gateway.openapi.yaml#/paths/~1aep~1v1~1admin~1model-gateway~1health'
  /aep/v1/admin/model-gateway/requests:
    $ref: './aep-v1-gateway.openapi.yaml#/paths/~1aep~1v1~1admin~1model-gateway~1requests'
  /aep/v1/admin/model-gateway/requests/{requestId}:
    $ref: './aep-v1-gateway.openapi.yaml#/paths/~1aep~1v1~1admin~1model-gateway~1requests~1{requestId}'
  /aep/v1/admin/model-gateway/limits:
    $ref: './aep-v1-gateway.openapi.yaml#/paths/~1aep~1v1~1admin~1model-gateway~1limits'
  /aep/v1/admin/model-gateway/limits/{ruleId}:
    $ref: './aep-v1-gateway.openapi.yaml#/paths/~1aep~1v1~1admin~1model-gateway~1limits~1{ruleId}'
  /aep/v1/admin/model-gateway/limits/publish:
    $ref: './aep-v1-gateway.openapi.yaml#/paths/~1aep~1v1~1admin~1model-gateway~1limits~1publish'
  /aep/v1/admin/model-gateway/limits/status:
    $ref: './aep-v1-gateway.openapi.yaml#/paths/~1aep~1v1~1admin~1model-gateway~1limits~1status'
  /aep/v1/admin/model-gateway/quotas/{userId}:
    $ref: './aep-v1-gateway.openapi.yaml#/paths/~1aep~1v1~1admin~1model-gateway~1quotas~1{userId}'
  /aep/v1/admin/model-gateway/quotas/{userId}/refresh:
    $ref: './aep-v1-gateway.openapi.yaml#/paths/~1aep~1v1~1admin~1model-gateway~1quotas~1{userId}~1refresh'
  /aep/v1/admin/model-gateway/quotas/{userId}/delta:
    $ref: './aep-v1-gateway.openapi.yaml#/paths/~1aep~1v1~1admin~1model-gateway~1quotas~1{userId}~1delta'
  /aep/v1/admin/model-gateway/models/{modelId}/test-access:
    $ref: './aep-v1-gateway.openapi.yaml#/paths/~1aep~1v1~1admin~1model-gateway~1models~1{modelId}~1test-access'
  /aep/v1/admin/data-plane/desired-state:
    get:
      tags: [Admin Data Plane]
      operationId: getDataPlaneDesiredState
      description: Returns the tenant-scoped model gateway state intended for reconciliation. Secret values are never returned.
      responses:
        '200':
          description: Current desired state, or an empty state when none has been published.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DataPlaneDesiredState'}
    put:
      tags: [Admin Data Plane]
      operationId: putDataPlaneDesiredState
      deprecated: true
      description: >-
        Manual escape hatch that publishes an operator-authored desired state.
        Deprecated: prefer publishDataPlaneRoutes so gateway routes are derived
        from the model catalog, which is the single source of truth. Secret
        references identify external Secret material and never contain values.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DataPlaneDesiredStateWrite'}
      responses:
        '200':
          description: Desired state accepted for reconciliation.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DataPlaneDesiredState'}
        '400': {$ref: './aep-v1-control-events.openapi.yaml#/components/responses/Problem'}
        '409': {$ref: './aep-v1-control-events.openapi.yaml#/components/responses/Problem'}
  /aep/v1/admin/data-plane/publish:
    post:
      tags: [Admin Data Plane]
      operationId: publishDataPlaneRoutes
      description: >-
        Derives gateway routes from the model catalog (enabled gateway models
        with an OpenAI-compatible or Anthropic protocol and a complete endpoint
        and upstream model) and atomically replaces the tenant's desired state.
        OpenAI-compatible models derive the ai-proxy openai provider route;
        Anthropic models derive an EnvoyFilter passthrough route under a
        per-model path prefix (clients use the gateway base URL plus the
        sanitized model ID as the path prefix). Routes for
        models bound to a Credential refer to the conventional Secret
        aep-credential-{credentialId} key api-key in higress-system; Secret
        values are provisioned by the deployment Secret system and are never
        accepted or returned by this API. When the derived state is unchanged
        the publish is a no-op and the stored revision and content hash are
        returned; otherwise the server assigns a content-addressed
        catalog-prefixed revision unless the request carries an explicit one.
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DataPlanePublishRequest'}
      responses:
        '200':
          description: Catalog-derived desired state stored for reconciliation.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DataPlaneDesiredState'}
        '400': {$ref: './aep-v1-control-events.openapi.yaml#/components/responses/Problem'}
  /aep/v1/admin/data-plane/status:
    get:
      tags: [Admin Data Plane]
      operationId: getDataPlaneStatus
      description: Returns the latest observed gateway reconciliation state and the drift between the catalog-publishable route set and the current desired routes.
      responses:
        '200':
          description: Data plane observation.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DataPlaneStatus'}
  /aep/v1/admin/deployment/settings:
    $ref: './aep-v1.openapi.yaml#/paths/~1admin~1deployment~1settings'
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  schemas:
    ServiceMetadata:
      type: object
      required: [service, supportedProtocolVersions, capabilities, jwksUri]
      properties:
        service: {type: string}
        supportedProtocolVersions: {type: array, items: {type: string}}
        capabilities:
          description: Only capabilities enabled by the current deployment.
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [password_auth, federated_auth, skills, telemetry, control_events, model_gateway, credentials, mcp, plugins]
        jwksUri: {type: string, format: uri-reference}
        modelGateway:
          $ref: '#/components/schemas/ModelGatewayMetadata'
          description: Present when the model_gateway capability is enabled.
        agentControl:
          $ref: '#/components/schemas/AgentControlMetadata'
          description: >-
            Present in split deployments: the base URL of the agent control
            protocol service (auth, heartbeat, control-event inbox, skills,
            telemetry). Clients keep using the API base URL when omitted —
            the all-in-one control-service mounts the identical routes.
    AgentControlMetadata:
      type: object
      required: [baseUrl]
      properties:
        baseUrl: {type: string, format: uri}
    ModelGatewayMetadata:
      type: object
      required: [baseUrl, protocol, apiVersion]
      properties:
        baseUrl: {type: string, format: uri-reference}
        protocol: {type: string, const: openai-compatible}
        apiVersion: {type: string, const: v1}
    PasswordChangeRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: {type: string, minLength: 1, maxLength: 1024, writeOnly: true}
        newPassword: {type: string, minLength: 12, maxLength: 1024, writeOnly: true}
    GatewayCapabilities:
      $ref: './aep-v1-gateway.openapi.yaml#/components/schemas/GatewayCapabilities'
    GatewayNativeResult:
      $ref: './aep-v1-gateway.openapi.yaml#/components/schemas/GatewayNativeResult'
    GatewayHealth:
      $ref: './aep-v1-gateway.openapi.yaml#/components/schemas/GatewayHealth'
    GatewayLimitWrite:
      $ref: './aep-v1-gateway.openapi.yaml#/components/schemas/GatewayLimitWrite'
    GatewayLimit:
      $ref: './aep-v1-gateway.openapi.yaml#/components/schemas/GatewayLimit'
    GatewayLimitPage:
      $ref: './aep-v1-gateway.openapi.yaml#/components/schemas/GatewayLimitPage'
    GatewayLimitPublication:
      $ref: './aep-v1-gateway.openapi.yaml#/components/schemas/GatewayLimitPublication'
    GatewayLimitStatus:
      $ref: './aep-v1-gateway.openapi.yaml#/components/schemas/GatewayLimitStatus'
    GatewayQuota:
      $ref: './aep-v1-gateway.openapi.yaml#/components/schemas/GatewayQuota'
    GatewayQuotaRefresh:
      $ref: './aep-v1-gateway.openapi.yaml#/components/schemas/GatewayQuotaRefresh'
    GatewayQuotaDelta:
      $ref: './aep-v1-gateway.openapi.yaml#/components/schemas/GatewayQuotaDelta'
    GatewayTestAccess:
      $ref: './aep-v1-gateway.openapi.yaml#/components/schemas/GatewayTestAccess'
    DataPlaneSecretReference:
      type: object
      required: [name, key]
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 253}
        key: {type: string, minLength: 1, maxLength: 253}
        namespace: {type: [string, 'null'], maxLength: 253}
    DataPlaneRoute:
      type: object
      required: [modelId, enabled, endpoint, upstreamModel, protocol]
      additionalProperties: false
      properties:
        modelId: {type: string, minLength: 1, maxLength: 200}
        enabled: {type: boolean}
        endpoint: {type: string, format: uri-reference}
        upstreamModel: {type: string, minLength: 1, maxLength: 200}
        protocol:
          description: Wire protocol the gateway serves for this route. openai-compatible routes render through the ai-proxy WasmPlugin; anthropic routes render as a self-contained EnvoyFilter passthrough with a per-model path prefix.
          type: string
          enum: [openai-compatible, anthropic]
        providerType:
          description: Higress AI Proxy provider implementation for openai-compatible routes. Forbidden (omitted) on anthropic routes. Omitted legacy routes use openai.
          type: string
          enum: [openai, deepseek]
        credentialRef: {$ref: '#/components/schemas/DataPlaneSecretReference'}
    DataPlaneDesiredStateWrite:
      type: object
      required: [revision, routes]
      additionalProperties: false
      properties:
        revision: {type: string, minLength: 1, maxLength: 200}
        routes:
          type: array
          maxItems: 500
          items: {$ref: '#/components/schemas/DataPlaneRoute'}
    DataPlanePublishRequest:
      type: object
      additionalProperties: false
      properties:
        revision:
          description: Optional explicit revision. When omitted the server assigns a content-addressed catalog-prefixed revision, making unchanged catalogs idempotent.
          type: string
          minLength: 1
          maxLength: 200
    DataPlaneDesiredState:
      allOf:
        - {$ref: '#/components/schemas/DataPlaneDesiredStateWrite'}
        - type: object
          required: [deploymentId, publishedAt, contentHash]
          properties:
            deploymentId: {type: string}
            publishedAt: {type: string, format: date-time}
            contentHash: {type: string, pattern: '^[a-f0-9]{64}$'}
    DataPlaneStatus:
      type: object
      required: [state, observedRevision, contentHash]
      additionalProperties: false
      properties:
        state: {type: string, enum: [pending, applying, ready, degraded, error]}
        observedRevision: {type: [string, 'null']}
        contentHash: {type: [string, 'null'], pattern: '^[a-f0-9]{64}$'}
        lastAppliedAt: {type: [string, 'null'], format: date-time}
        errorCode: {type: [string, 'null']}
        message: {type: [string, 'null'], maxLength: 2000}
        resourceCount: {type: integer, minimum: 0}
        catalogComparison:
          description: Drift between the route set the model catalog would publish and the current desired routes. Absent only in responses predating this field.
          $ref: '#/components/schemas/DataPlaneCatalogComparison'
    DataPlaneCatalogComparison:
      type: object
      required: [missing, extra, mismatched]
      additionalProperties: false
      properties:
        missing:
          description: Catalog-publishable model identifiers with no desired route.
          type: array
          items: {type: string}
        extra:
          description: Desired-route model identifiers the catalog would not publish.
          type: array
          items: {type: string}
        mismatched:
          description: Models present in both sets whose route fields differ from the catalog-derived route.
          type: array
          items:
            type: object
            required: [modelId, fields]
            additionalProperties: false
            properties:
              modelId: {type: string}
              fields:
                type: array
                minItems: 1
                items:
                  type: string
                  enum: [enabled, endpoint, upstreamModel, protocol, providerType, credentialRef]
    JsonWebKeySet:
      type: object
      required: [keys]
      properties:
        keys:
          type: array
          items:
            type: object
            required: [kty, kid, use, alg, crv, x]
            properties:
              kty: {type: string, const: OKP}
              kid: {type: string}
              use: {type: string, const: sig}
              alg: {type: string, const: EdDSA}
              crv: {type: string, const: Ed25519}
              x: {type: string}
