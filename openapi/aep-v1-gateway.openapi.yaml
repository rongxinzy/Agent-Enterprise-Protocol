        "503":
          "$ref": "#/components/responses/Problem"
      "parameters":
        - 
          "name": "start"
          "in": "query"
          "required": true
          "schema":
            "type": "string"
            "format": "date-time"
        - 
          "name": "end"
          "in": "query"
          "required": true
          "schema":
            "type": "string"
            "format": "date-time"
        - 
          "name": "step"
          "in": "query"
          "required": false
          "schema":
            "type": "integer"
            "minimum": 1
            "maximum": 3600
        - 
          "name": "metric"
          "in": "query"
          "required": true
          "schema":
            "type": "string"
            "enum":
              - "input_tokens"
              - "output_tokens"
              - "calls"
              - "failures"
              - "first_token_duration"
              - "service_duration"
              - "downstream_qps"
              - "upstream_qps"
              - "downstream_success_rate"
              - "upstream_success_rate"
              - "auth_requests"
        - 
          "name": "groupBy"
          "in": "query"
          "required": false
          "schema":
            "type": "string"
            "enum":
              - "none"
              - "model"
              - "route"
              - "user"
              - "team"
              - "role"
        - 
          "name": "modelId"
          "in": "query"
          "required": false
          "schema":
            "type": "string"
            "minLength": 1
            "maxLength": 200
        - 
