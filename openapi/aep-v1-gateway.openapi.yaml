    "GatewayQuotaRefresh":
      "$ref": "./aep-v1-gateway-schemas.openapi.yaml#/components/schemas/GatewayQuotaRefresh"
    "GatewayQuotaDelta":
      "$ref": "./aep-v1-gateway-schemas.openapi.yaml#/components/schemas/GatewayQuotaDelta"
    "GatewayModelTokenRequest":
