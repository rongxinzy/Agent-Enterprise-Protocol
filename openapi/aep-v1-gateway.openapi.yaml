"components":
  "securitySchemes":
    "bearerAuth":
      "type": "http"
      "scheme": "bearer"
      "bearerFormat": "JWT"
  "responses":
    "Problem":
      "$ref": "./aep-v1-authentication.openapi.yaml#/components/responses/Problem"
  "schemas":
    "GatewayCapabilities":
      "type": "object"
      "required":
        - "sources"
        - "dimensions"
        - "metrics"
        - "unsupported"
      "additionalProperties": false
      "properties":
        "sources":
          "type": "object"
          "required":
            - "prometheus"
            - "loki"
            - "quota"
            - "testAccess"
          "additionalProperties": false
          "properties":
            "prometheus":
              "type": "boolean"
            "loki":
              "type": "boolean"
            "quota":
              "type": "boolean"
            "testAccess":
              "type": "boolean"
        "dimensions":
          "type": "array"
          "items":
            "type": "string"
            "enum":
              - "model"
              - "route"
              - "user"
              - "team"
              - "role"
        "metrics":
          "type": "array"
          "items":
            "type": "string"
        "unsupported":
          "type": "array"
          "items":
            "type": "string"
    "GatewayNativeResult":
      "type": "object"
      "required":
        - "source"
        - "queriedAt"
        - "data"
      "additionalProperties": false
      "properties":
        "source":
          "type": "string"
          "enum":
            - "prometheus"
            - "loki"
        "queriedAt":
          "type": "string"
          "format": "date-time"
        "data":
          "type": "object"
          "additionalProperties": true
    "GatewayHealth":
      "type": "object"
      "required":
        - "sources"
      "additionalProperties": false
      "properties":
        "sources":
          "type": "array"
          "items":
            "type": "object"
            "required":
              - "source"
              - "state"
              - "checkedAt"
              - "targets"
            "additionalProperties": false
            "properties":
              "source":
                "type": "string"
                "enum":
                  - "prometheus"
                  - "loki"
                  - "quota"
              "state":
                "type": "string"
                "enum":
                  - "disabled"
                  - "healthy"
                  - "unavailable"
              "checkedAt":
                "type": "string"
                "format": "date-time"
              "targets":
                "type": "array"
                "items":
                  "type": "object"
                  "required":
                    - "health"
                    - "lastScrape"
                    - "lastScrapeDuration"
                  "additionalProperties": false
                  "properties":
                    "health":
                      "type": "string"
                    "lastScrape":
                      "type": "string"
                    "lastScrapeDuration":
                      "type": "number"
    "GatewayLimitWrite":
      "type": "object"
      "required":
        - "kind"
        - "scopeType"
        - "maximum"
        - "interval"
        - "enabled"
        - "expectedVersion"
      "additionalProperties": false
      "properties":
        "kind":
          "type": "string"
          "enum":
            - "requests"
            - "tokens"
        "scopeType":
          "type": "string"
          "enum":
            - "global"
            - "model"
            - "user"
            - "team"
            - "role"
        "scopeId":
          "type":
            - "string"
            - "null"
          "maxLength": 200
        "modelId":
          "type":
            - "string"
            - "null"
          "maxLength": 200
        "maximum":
          "type": "integer"
          "minimum": 1
          "maximum": 1000000000000
        "interval":
