"openapi": "3.1.0"
"info":
  "title": "AEP native model gateway management"
  "version": "1.0.0"
  "description": "Native Higress and monitoring integration. AEP performs authorization and source queries, never calculates usage or costs. P95/P99 and cost are excluded. Optional sources return explicit unavailable/unsupported problems rather than fabricated values."
  "license":
    "name": "Apache 2.0"
    "identifier": "Apache-2.0"
"servers":
  - 
    "url": "http://localhost:8080"
"security":
  - 
    "bearerAuth": []
"tags":
  - 
    "name": "Admin Model Gateway"
    "description": "Read source results and manage native plugins within the authenticated deployment."
"paths":
  "/aep/v1/admin/model-gateway/capabilities":
    "get":
      "tags":
        - "Admin Model Gateway"
      "operationId": "getGatewayCapabilities"
      "summary": "get Gateway Capabilities"
      "responses":
        "200":
          "description": "Native source result or managed configuration"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/GatewayCapabilities"
        "400":
          "$ref": "#/components/responses/Problem"
        "401":
          "$ref": "#/components/responses/Problem"
        "403":
          "$ref": "#/components/responses/Problem"
        "404":
          "$ref": "#/components/responses/Problem"
        "409":
          "$ref": "#/components/responses/Problem"
        "422":
          "$ref": "#/components/responses/Problem"
        "503":
          "$ref": "#/components/responses/Problem"
  "/aep/v1/admin/model-gateway/metrics":
    "get":
      "tags":
        - "Admin Model Gateway"
      "operationId": "queryGatewayMetrics"
      "summary": "query Gateway Metrics"
      "description": "Returns native values with an explicit metric definition. Catalog model and organization filters use Loki and can change calls/failures semantics. Set expectedDefinition to reject a definition change; clients must not combine series with different definitions."
      "responses":
        "200":
          "description": "Native source result or managed configuration"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/GatewayMetricResult"
        "400":
          "$ref": "#/components/responses/Problem"
        "401":
          "$ref": "#/components/responses/Problem"
        "403":
          "$ref": "#/components/responses/Problem"
        "404":
          "$ref": "#/components/responses/Problem"
        "409":
          "$ref": "#/components/responses/Problem"
        "422":
          "$ref": "#/components/responses/Problem"
        "503":
          "$ref": "#/components/responses/Problem"
      "parameters":
        -
          "name": "expectedDefinition"
          "in": "query"
          "required": false
          "description": "Pin a previously returned definition.id. A different selected definition returns 422 GATEWAY_METRIC_DEFINITION_MISMATCH without querying the source."
          "schema":
            "$ref": "#/components/schemas/GatewayMetricDefinitionId"
        - 
          "name": "start"
          "in": "query"
          "required": true
          "schema":
            "type": "string"
            "format": "date-time"
        - 
          "name": "end"
          "in": "query"
          "required": true
          "schema":
            "type": "string"
            "format": "date-time"
        - 
          "name": "step"
          "in": "query"
          "required": false
          "schema":
            "type": "integer"
            "minimum": 1
            "maximum": 3600
        - 
          "name": "metric"
          "in": "query"
          "required": true
          "schema":
            "type": "string"
            "enum":
              - "input_tokens"
              - "output_tokens"
              - "calls"
              - "failures"
              - "first_token_duration"
              - "service_duration"
              - "downstream_qps"
              - "upstream_qps"
              - "downstream_success_rate"
              - "upstream_success_rate"
              - "auth_requests"
        - 
          "name": "groupBy"
          "in": "query"
          "required": false
          "schema":
            "type": "string"
            "enum":
              - "none"
              - "model"
              - "route"
              - "user"
              - "team"
              - "role"
        - 
          "name": "modelId"
          "in": "query"
          "required": false
          "schema":
            "type": "string"
            "minLength": 1
            "maxLength": 200
        - 
          "name": "userId"
          "in": "query"
          "required": false
          "schema":
            "type": "string"
            "minLength": 1
            "maxLength": 200
        - 
          "name": "teamId"
          "in": "query"
          "required": false
          "schema":
            "type": "string"
            "minLength": 1
            "maxLength": 200
        - 
          "name": "roleId"
          "in": "query"
          "required": false
          "schema":
            "type": "string"
            "minLength": 1
            "maxLength": 200
  "/aep/v1/admin/model-gateway/health":
    "get":
      "tags":
        - "Admin Model Gateway"
      "operationId": "getGatewayMonitoringHealth"
      "summary": "get Gateway Monitoring Health"
      "responses":
        "200":
          "description": "Native source result or managed configuration"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/GatewayHealth"
        "400":
          "$ref": "#/components/responses/Problem"
        "401":
          "$ref": "#/components/responses/Problem"
        "403":
          "$ref": "#/components/responses/Problem"
        "404":
          "$ref": "#/components/responses/Problem"
        "409":
          "$ref": "#/components/responses/Problem"
        "422":
          "$ref": "#/components/responses/Problem"
        "503":
          "$ref": "#/components/responses/Problem"
  "/aep/v1/admin/model-gateway/requests":
    "get":
      "tags":
        - "Admin Model Gateway"
      "operationId": "searchGatewayRequests"
      "summary": "search Gateway Requests"
      "responses":
        "200":
          "description": "Native source result or managed configuration"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/GatewayNativeResult"
        "400":
          "$ref": "#/components/responses/Problem"
        "401":
          "$ref": "#/components/responses/Problem"
        "403":
          "$ref": "#/components/responses/Problem"
        "404":
          "$ref": "#/components/responses/Problem"
        "409":
          "$ref": "#/components/responses/Problem"
        "422":
          "$ref": "#/components/responses/Problem"
        "503":
          "$ref": "#/components/responses/Problem"
      "parameters":
        - 
          "name": "start"
          "in": "query"
          "required": true
          "schema":
            "type": "string"
            "format": "date-time"
        - 
          "name": "end"
          "in": "query"
          "required": true
          "schema":
            "type": "string"
            "format": "date-time"
        - 
          "name": "modelId"
          "in": "query"
          "required": false
          "schema":
            "type": "string"
            "minLength": 1
            "maxLength": 200
        - 
          "name": "userId"
          "in": "query"
          "required": false
          "schema":
            "type": "string"
            "minLength": 1
            "maxLength": 200
        - 
          "name": "teamId"
          "in": "query"
          "required": false
          "schema":
            "type": "string"
            "minLength": 1
            "maxLength": 200
        - 
          "name": "roleId"
          "in": "query"
          "required": false
          "schema":
            "type": "string"
            "minLength": 1
            "maxLength": 200
        - 
          "name": "source"
          "in": "query"
          "required": false
          "schema":
            "type": "string"
            "enum":
              - "all"
              - "gateway"
              - "authorizer"
        - 
          "name": "limit"
          "in": "query"
          "required": false
          "schema":
            "type": "integer"
            "minimum": 1
            "maximum": 200
        - 
          "name": "cursor"
          "in": "query"
          "required": false
          "schema":
            "type": "string"
            "pattern": "^[0-9]{1,20}$"
  "/aep/v1/admin/model-gateway/requests/{requestId}":
    "get":
      "tags":
        - "Admin Model Gateway"
      "operationId": "getGatewayRequest"
      "summary": "get Gateway Request"
      "responses":
        "200":
          "description": "Native source result or managed configuration"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/GatewayNativeResult"
        "400":
          "$ref": "#/components/responses/Problem"
        "401":
          "$ref": "#/components/responses/Problem"
        "403":
          "$ref": "#/components/responses/Problem"
        "404":
          "$ref": "#/components/responses/Problem"
        "409":
          "$ref": "#/components/responses/Problem"
        "422":
          "$ref": "#/components/responses/Problem"
        "503":
          "$ref": "#/components/responses/Problem"
      "parameters":
        - 
          "name": "requestId"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "minLength": 1
            "maxLength": 200
        - 
          "name": "start"
          "in": "query"
          "required": true
          "schema":
            "type": "string"
            "format": "date-time"
        - 
          "name": "end"
          "in": "query"
          "required": true
          "schema":
            "type": "string"
            "format": "date-time"
        - 
          "name": "modelId"
          "in": "query"
          "required": false
          "schema":
            "type": "string"
            "minLength": 1
            "maxLength": 200
        - 
          "name": "userId"
          "in": "query"
          "required": false
          "schema":
            "type": "string"
            "minLength": 1
            "maxLength": 200
        - 
          "name": "teamId"
          "in": "query"
          "required": false
          "schema":
            "type": "string"
            "minLength": 1
            "maxLength": 200
        - 
          "name": "roleId"
          "in": "query"
          "required": false
          "schema":
            "type": "string"
            "minLength": 1
            "maxLength": 200
        - 
          "name": "source"
          "in": "query"
          "required": false
          "schema":
            "type": "string"
            "enum":
              - "all"
              - "gateway"
              - "authorizer"
        - 
          "name": "limit"
          "in": "query"
          "required": false
          "schema":
            "type": "integer"
            "minimum": 1
            "maximum": 200
        - 
          "name": "cursor"
          "in": "query"
          "required": false
          "schema":
            "type": "string"
            "pattern": "^[0-9]{1,20}$"
  "/aep/v1/admin/model-gateway/limits":
    "$ref": "./aep-v1-gateway-policy.openapi.yaml#/paths/~1aep~1v1~1admin~1model-gateway~1limits"
  "/aep/v1/admin/model-gateway/limits/{ruleId}":
    "$ref": "./aep-v1-gateway-policy.openapi.yaml#/paths/~1aep~1v1~1admin~1model-gateway~1limits~1{ruleId}"
  "/aep/v1/admin/model-gateway/limits/publish":
    "$ref": "./aep-v1-gateway-policy.openapi.yaml#/paths/~1aep~1v1~1admin~1model-gateway~1limits~1publish"
  "/aep/v1/admin/model-gateway/limits/status":
    "$ref": "./aep-v1-gateway-policy.openapi.yaml#/paths/~1aep~1v1~1admin~1model-gateway~1limits~1status"
  "/aep/v1/admin/model-gateway/quotas/{userId}":
    "$ref": "./aep-v1-gateway-policy.openapi.yaml#/paths/~1aep~1v1~1admin~1model-gateway~1quotas~1{userId}"
  "/aep/v1/admin/model-gateway/quotas/{userId}/refresh":
    "$ref": "./aep-v1-gateway-policy.openapi.yaml#/paths/~1aep~1v1~1admin~1model-gateway~1quotas~1{userId}~1refresh"
  "/aep/v1/admin/model-gateway/quotas/{userId}/delta":
    "$ref": "./aep-v1-gateway-policy.openapi.yaml#/paths/~1aep~1v1~1admin~1model-gateway~1quotas~1{userId}~1delta"
  "/aep/v1/admin/model-gateway/tokens":
    "$ref": "./aep-v1-gateway-policy.openapi.yaml#/paths/~1aep~1v1~1admin~1model-gateway~1tokens"
  "/aep/v1/admin/model-gateway/models/{modelId}/test-access":
    "$ref": "./aep-v1-gateway-policy.openapi.yaml#/paths/~1aep~1v1~1admin~1model-gateway~1models~1{modelId}~1test-access"
"components":
  "securitySchemes":
    "bearerAuth":
      "type": "http"
      "scheme": "bearer"
      "bearerFormat": "JWT"
  "responses":
    "Problem":
      "$ref": "./aep-v1-authentication.openapi.yaml#/components/responses/Problem"
  "schemas":
    "GatewayCapabilities":
      "$ref": "./aep-v1-gateway-schemas.openapi.yaml#/components/schemas/GatewayCapabilities"
    "GatewayMetricDefinitionId":
      "$ref": "./aep-v1-gateway-schemas.openapi.yaml#/components/schemas/GatewayMetricDefinitionId"
    "GatewayMetricDefinition":
      "$ref": "./aep-v1-gateway-schemas.openapi.yaml#/components/schemas/GatewayMetricDefinition"
    "GatewayMetricResult":
      "$ref": "./aep-v1-gateway-schemas.openapi.yaml#/components/schemas/GatewayMetricResult"
    "GatewayNativeResult":
      "$ref": "./aep-v1-gateway-schemas.openapi.yaml#/components/schemas/GatewayNativeResult"
    "GatewayHealth":
      "$ref": "./aep-v1-gateway-schemas.openapi.yaml#/components/schemas/GatewayHealth"
    "GatewayLimitWrite":
      "$ref": "./aep-v1-gateway-schemas.openapi.yaml#/components/schemas/GatewayLimitWrite"
    "GatewayLimit":
      "$ref": "./aep-v1-gateway-schemas.openapi.yaml#/components/schemas/GatewayLimit"
    "GatewayLimitPage":
