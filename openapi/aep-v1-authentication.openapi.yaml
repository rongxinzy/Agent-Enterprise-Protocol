openapi: 3.1.0
info:
  title: Agent Enterprise Protocol Authentication API
  version: 1.0.0-rc.1
  description: >-
    AEP v1 authentication, platform-account administration, and login-issued
    Model Gateway credential contract.
  license: {name: Apache 2.0, identifier: Apache-2.0}
servers:
  - url: https://enterprise.example.com/aep/v1
    description: HTTPS deployment
  - url: http://enterprise.example.com/aep/v1
    description: HTTP deployment
  - url: http://localhost:8080/aep/v1
    description: Local development
tags:
  - {name: Authentication}
  - {name: Admin Users}
  - {name: Admin RBAC}
  - {name: Admin Agents}
  - {name: Admin Identity}
  - {name: Admin Data Scope}
paths:
  /auth/methods:
    get:
      tags: [Authentication]
      operationId: getAuthenticationMethods
      security: []
      parameters:
        - name: deploymentHint
          in: query
          required: false
          schema: {type: string, minLength: 1}
      responses:
        '200':
          description: Available authentication methods
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthenticationMethods'}
        '404': {$ref: '#/components/responses/Problem'}
  /auth/password/login:
    post:
      tags: [Authentication]
      operationId: loginWithPassword
      description: >-
        Authenticates an administrator-provisioned ZhiYuan platform account.
        HTTP and HTTPS are valid in development and production. HTTPS is
        strongly recommended outside a trusted private network because plain
        HTTP exposes credentials and bearer tokens in transit.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasswordLoginRequest'}
      responses:
        '200': {$ref: '#/components/responses/TokenResponse'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
  /auth/federated/start:
    post:
      tags: [Authentication]
      operationId: startFederatedLogin
      description: >-
        Starts a system-browser login through a customer OIDC provider or
        another server-side identity adapter.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FederatedLoginStartRequest'}
      responses:
        '200':
          description: Federated login transaction
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FederatedLoginStartResponse'}
        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /auth/exchange:
    post:
      tags: [Authentication]
      operationId: exchangeFederatedAuthorizationCode
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FederatedExchangeRequest'}
      responses:
        '200': {$ref: '#/components/responses/TokenResponse'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
  /auth/refresh:
    post:
      tags: [Authentication]
      operationId: refreshAuthenticationSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RefreshRequest'}
      responses:
        '200': {$ref: '#/components/responses/TokenResponse'}
        '401': {$ref: '#/components/responses/Problem'}
  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logoutAuthenticationSession
      security:
        - aepBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LogoutRequest'}
      responses:
        '204': {description: Session revoked}
        '401': {$ref: '#/components/responses/Problem'}
  /user/activation:
    post:
      tags: [Authentication]
      operationId: activateDeploymentLicense
      description: >-
        Exchanges the authenticated deployment session for a short-lived
        entitlement token bound to the authenticated user and session. The
        Control Service verifies its own registered vendor-signed License at
        startup and never receives License material from the client.
      security:
        - aepBearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LicenseActivationRequest'}
      responses:
        '200':
          description: Deployment entitlement token
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EntitlementTokenResponse'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /admin/users:
    get:
      tags: [Admin Users]
      operationId: listPlatformUsers
      security:
        - aepBearerAuth: []
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Platform user page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlatformUserPage'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Admin Users]
      operationId: createPlatformUser
      security:
        - aepBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreatePlatformUserRequest'}
      responses:
        '201':
          description: Platform user created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlatformUser'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /admin/users/import:
    post:
      tags: [Admin Users]
      operationId: importPlatformUsers
      description: Imports at most 1000 administrator-provisioned accounts.
      security:
        - aepBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ImportPlatformUsersRequest'}
      responses:
        '200':
          description: Import result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportPlatformUsersResponse'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /admin/users/{userId}:
    patch:
      tags: [Admin Users]
      operationId: updatePlatformUser
      security:
        - aepBearerAuth: []
      parameters:
        - {$ref: '#/components/parameters/UserId'}
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: {$ref: '#/components/schemas/UpdatePlatformUserRequest'}
      responses:
        '200':
          description: Platform user updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlatformUser'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /admin/users/{userId}/reset-password:
    post:
      tags: [Admin Users]
      operationId: resetPlatformUserPassword
      security:
        - aepBearerAuth: []
      parameters:
        - {$ref: '#/components/parameters/UserId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResetPasswordRequest'}
      responses:
        '204': {description: Temporary password set and refresh sessions revoked}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /admin/permissions:
    get:
      tags: [Admin RBAC]
      operationId: listPermissions
      security: [{aepBearerAuth: []}]
      responses:
        '200':
          description: Permission catalog
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PermissionPage'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /admin/roles:
    get:
      tags: [Admin RBAC]
      operationId: listRoles
      security: [{aepBearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Deployment roles
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RolePage'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Admin RBAC]
      operationId: createRole
      security: [{aepBearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateRoleRequest'}
      responses:
        '201':
          description: Role created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Role'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /admin/roles/{roleId}:
    parameters:
      - {$ref: '#/components/parameters/RoleId'}
    get:
      tags: [Admin RBAC]
      operationId: getRole
      security: [{aepBearerAuth: []}]
      responses:
        '200':
          description: Deployment role
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Role'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    patch:
      tags: [Admin RBAC]
      operationId: updateRole
      security: [{aepBearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateRoleRequest'}
      responses:
        '200':
          description: Updated role
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Role'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
    delete:
      tags: [Admin RBAC]
      operationId: deleteRole
      security: [{aepBearerAuth: []}]
      responses:
        '204': {description: Role deleted}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /admin/teams:
    get:
      tags: [Admin RBAC]
      operationId: listTeams
      security: [{aepBearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Deployment teams
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TeamPage'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Admin RBAC]
      operationId: createTeam
      security: [{aepBearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateTeamRequest'}
      responses:
        '201':
          description: Team created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Team'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /admin/teams/{teamId}:
    parameters:
      - {$ref: '#/components/parameters/TeamId'}
    get:
      tags: [Admin RBAC]
      operationId: getTeam
      security: [{aepBearerAuth: []}]
      responses:
        '200':
          description: Deployment Team
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Team'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    patch:
      tags: [Admin RBAC]
      operationId: updateTeam
      security: [{aepBearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateTeamRequest'}
      responses:
        '200':
          description: Updated Team
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Team'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
    delete:
      tags: [Admin RBAC]
      operationId: deleteTeam
      security: [{aepBearerAuth: []}]
      responses:
        '204': {description: Team deleted}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /admin/users/{userId}/rbac:
    put:
      tags: [Admin RBAC]
      operationId: replaceUserRBAC
      security: [{aepBearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/UserId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReplaceUserRBACRequest'}
      responses:
        '200':
          description: User role and Team bindings
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UserRBAC'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /admin/agents:
    get:
      tags: [Admin Agents]
      operationId: listAgents
      description: >-
        Requires the users.read permission (or a full administrator). Returns
        the digital employee directory page by page. Cursor pagination follows
        the admin users convention: pass nextCursor back as cursor until it is
        null. Problem codes: TOKEN_INVALID, ACCESS_DENIED.
      security: [{aepBearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Digital employee directory page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentDirectoryPage'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Admin Agents]
      operationId: createAgent
      description: >-
        Requires the users.write permission (or a full administrator). Creates
        a digital employee platform account. The home team is always granted in
        addition to teamIds. The password must be at least 8 characters and is
        stored only as an Argon2id hash. Problem codes: 400 INVALID_AGENT,
        USER_RBAC_REQUIRED, INVALID_ROLE, or INVALID_TEAM; 403
        ROLE_GRANT_FORBIDDEN or TEAM_GRANT_FORBIDDEN; 409 AGENT_EXISTS.
      security: [{aepBearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateAgentRequest'}
      responses:
        '201':
          description: Digital employee created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentResponse'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /admin/agents/{agentId}/profile:
    put:
      tags: [Admin Agents]
      operationId: updateAgentProfile
      description: >-
        Requires the users.write permission (or a full administrator). Updates
        the digital employee profile. Every field is optional; a null value
        clears the stored field. Changing homeTeamId requires the same team
        grant rights as creation. Problem codes: 400 INVALID_AGENT; 404
        RESOURCE_NOT_FOUND.
      security: [{aepBearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/AgentId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpdateAgentProfileRequest'}
      responses:
        '200':
          description: Updated digital employee profile
          content:
            application/json:
              schema: {$ref: '#/components/schemas/UpdateAgentProfileResponse'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /admin/identity-sources:
    get:
      tags: [Admin Identity]
      operationId: listIdentitySources
      description: >-
        Requires the identity.read permission (or a full administrator).
        Returns the configured external identity sources page by page. The
        stored connector config is never echoed. Problem codes: TOKEN_INVALID,
        ACCESS_DENIED.
      security: [{aepBearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Identity source page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IdentitySourcePage'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Admin Identity]
      operationId: createIdentitySource
      description: >-
        Requires the identity.write permission (or a full administrator).
        Registers an external identity source. kind is a protocol category
        only (ldap, oidc, or directory); product-specific connector flavors
        belong inside config on the deployment side. config MUST be a JSON
        object and MUST NOT contain secret keys; secret material may only be
        expressed as credential store references. Problem codes: 400
        INVALID_IDENTITY_SOURCE; 409 IDENTITY_SOURCE_EXISTS.
      security: [{aepBearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateIdentitySourceRequest'}
      responses:
        '201':
          description: Identity source registered
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IdentitySource'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /admin/identity-sources/{sourceId}/mappings:
    get:
      tags: [Admin Identity]
      operationId: listIdentityMappings
      description: >-
        Requires the identity.read permission (or a full administrator).
        Returns the subject mappings of one identity source page by page.
        Problem codes: TOKEN_INVALID, ACCESS_DENIED.
      security: [{aepBearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/SourceId'}
        - name: subjectType
          in: query
          required: false
          schema: {type: string, enum: [user, team]}
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Identity mapping page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IdentityMappingPage'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
    put:
      tags: [Admin Identity]
      operationId: upsertIdentityMapping
      description: >-
        Requires the identity.write permission (or a full administrator).
        Creates or replaces the mapping of one external subject to one local
        user or team. Problem codes: 400 INVALID_IDENTITY_MAPPING; 404
        RESOURCE_NOT_FOUND.
      security: [{aepBearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/SourceId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/UpsertIdentityMappingRequest'}
      responses:
        '201':
          description: Mapping stored
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IdentityMappingResult'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /admin/identity-sources/{sourceId}/mappings/{subjectType}/{externalId}:
    delete:
      tags: [Admin Identity]
      operationId: deleteIdentityMapping
      description: >-
        Requires the identity.write permission (or a full administrator).
        Removes one external subject mapping. Deleting an unknown mapping is
        idempotent and still returns 204.
      security: [{aepBearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/SourceId'}
        - {$ref: '#/components/parameters/ExternalSubjectType'}
        - {$ref: '#/components/parameters/ExternalId'}
      responses:
        '204': {description: Mapping removed}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /admin/data-scope-rules:
    get:
      tags: [Admin Data Scope]
      operationId: listDataScopeRules
      description: >-
        Requires the data_scope.read permission (or a full administrator).
        Returns the deployment data scope rules page by page. Problem codes:
        TOKEN_INVALID, ACCESS_DENIED.
      security: [{aepBearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Data scope rule page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DataScopeRulePage'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Admin Data Scope]
      operationId: createDataScopeRule
      description: >-
        Requires the data_scope.write permission (or a full administrator).
        Creates a data scope rule. resourceKind is the protocol-defined team
        or a deployment-defined lowercase identifier; the control plane treats
        every non-team kind as an opaque reference. Problem codes: 400
        INVALID_DATA_SCOPE_RULE; 409 DATA_SCOPE_RULE_EXISTS.
      security: [{aepBearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateDataScopeRuleRequest'}
      responses:
        '201':
          description: Data scope rule created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DataScopeRule'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /admin/data-scope-rules/{ruleId}:
    parameters:
      - {$ref: '#/components/parameters/RuleId'}
    get:
      tags: [Admin Data Scope]
      operationId: getDataScopeRule
      description: >-
        Requires the data_scope.read permission (or a full administrator).
        Returns one data scope rule. Problem codes: RESOURCE_NOT_FOUND.
      security: [{aepBearerAuth: []}]
      responses:
        '200':
          description: Data scope rule
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DataScopeRule'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
    delete:
      tags: [Admin Data Scope]
      operationId: deleteDataScopeRule
      description: >-
        Requires the data_scope.write permission (or a full administrator).
        Deletes one data scope rule. Deleting an unknown rule is idempotent
        and still returns 204.
      security: [{aepBearerAuth: []}]
      responses:
        '204': {description: Data scope rule deleted}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /admin/data-scope/context:
    get:
      tags: [Admin Data Scope]
      operationId: getDataScopeContext
      description: >-
        Requires the data_scope.read permission (or a full administrator).
        Returns the derived retrieval authorization context for one user. The
        organization scope is the subtree of the user's teams. allowed and
        denied resources are (kind, id) references; kind team is
        protocol-defined and every other kind is deployment-defined and
        opaque to the control plane. Problem codes: 400 USER_REQUIRED; 404
        RESOURCE_NOT_FOUND.
      security: [{aepBearerAuth: []}]
      parameters:
        - name: userId
          in: query
          required: true
          schema: {type: string, minLength: 1}
      responses:
        '200':
          description: Derived retrieval context
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RetrievalContext'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    aepBearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    UserId: {name: userId, in: path, required: true, schema: {type: string}}
    RoleId: {name: roleId, in: path, required: true, schema: {type: string}}
    TeamId: {name: teamId, in: path, required: true, schema: {type: string}}
    AgentId: {name: agentId, in: path, required: true, schema: {type: string}}
    SourceId: {name: sourceId, in: path, required: true, schema: {type: string}}
    ExternalSubjectType: {name: subjectType, in: path, required: true, schema: {type: string, enum: [user, team]}}
    ExternalId: {name: externalId, in: path, required: true, schema: {type: string}}
    RuleId: {name: ruleId, in: path, required: true, schema: {type: string}}
    Cursor: {name: cursor, in: query, schema: {type: [string, 'null']}}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
  responses:
    Problem:
      description: AEP Problem Details
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    TokenResponse:
      description: >-
        AEP session tokens. The model token is issued at login or refresh and
        is validated locally by the Model Gateway without a per-request
        authorization call to the Control Service.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/TokenResponse'}
  schemas:
    AuthenticationMethods:
      type: object
      description: >-
        Authentication methods enabled for the deployment. The built-in
        password method has the stable ID zhiyuan-password. Federated methods
        are optional and MUST NOT be returned unless a production identity
        adapter is configured.
      required: [deployment, methods]
      properties:
        deployment: {$ref: '#/components/schemas/Deployment'}
        deploymentId: {type: string, minLength: 1}
        preferredMethodId:
          type: [string, 'null']
          description: The ID of the preferred enabled method. Defaults to zhiyuan-password for the password-only production profile.
        methods:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/AuthenticationMethod'}
    AuthenticationMethod:
      type: object
      required: [id, type, displayName]
      properties:
        id: {type: string}
        type: {type: string, enum: [password, federated]}
        protocol: {type: [string, 'null'], enum: [oidc, saml, custom, null]}
        displayName: {type: string}
    Deployment:
      type: object
      required: [id, name]
      properties:
        id: {type: string}
        name: {type: string}
    PasswordLoginRequest:
      type: object
      required: [deploymentId, username, password]
      properties:
        deploymentId: {type: string, minLength: 1}
        sessionId: {type: string, minLength: 1}
        username: {type: string, minLength: 1, maxLength: 256}
        password: {type: string, minLength: 1, maxLength: 1024, writeOnly: true}
    FederatedLoginStartRequest:
      type: object
      required: [deploymentId, methodId, redirectUri, codeChallenge]
      properties:
        deploymentId: {type: string, minLength: 1}
        sessionId: {type: string, minLength: 1}
        methodId: {type: string, minLength: 1}
        redirectUri: {type: string, format: uri}
        codeChallenge: {type: string, minLength: 43, maxLength: 128}
        codeChallengeMethod: {type: string, const: S256, default: S256}
    FederatedLoginStartResponse:
      type: object
      required: [transactionId, authorizationUrl, state, expiresIn]
      properties:
        transactionId: {type: string}
        authorizationUrl: {type: string, format: uri}
        state: {type: string, minLength: 16}
        expiresIn: {type: integer, minimum: 1, maximum: 600}
    FederatedExchangeRequest:
      type: object
      required: [transactionId, authorizationCode, redirectUri, codeVerifier]
      properties:
        transactionId: {type: string, minLength: 1}
        authorizationCode: {type: string, minLength: 1}
        redirectUri: {type: string, format: uri}
        codeVerifier: {type: string, minLength: 43, maxLength: 128, writeOnly: true}
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: {type: string, minLength: 1, writeOnly: true}
        sessionId: {type: string, minLength: 1, description: User session identifier.}
    LogoutRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: {type: string, minLength: 1, writeOnly: true}
    TokenResponse:
      type: object
      required:
        - accessToken
        - refreshToken
        - modelAccessToken
        - tokenType
        - expiresIn
        - modelAccessExpiresIn
        - passwordChangeRequired
      properties:
        accessToken:
          type: string
          description: Bearer token for AEP management APIs.
        refreshToken: {type: string, writeOnly: true}
        modelAccessToken:
          type: string
          description: >-
            Bearer token with a Model Gateway audience and model grant claims.
            The gateway validates it locally on each inference request.
        tokenType: {type: string, const: Bearer}
        expiresIn: {type: integer, minimum: 1}
        modelAccessExpiresIn: {type: integer, minimum: 1}
        deploymentId: {type: string, minLength: 1}
        sessionId: {type: string, minLength: 1}
        passwordChangeRequired:
          type: boolean
          description: >-
            When true, the access session is restricted to current identity,
            password change, and logout operations. The model token has no
            model scopes until the password is changed.
    LicenseActivationRequest:
      type: object
      additionalProperties: false
      description: Empty activation request. The server-side registered License is used.
    EntitlementTokenResponse:
      type: object
      required: [entitlementToken, tokenType, expiresAt, expiresIn, licenseId, licenseDigest, deploymentId, features, modelScopes]
      properties:
        entitlementToken:
          type: string
          description: Short-lived service-signed token bound to the authenticated deployment, user, and session for runtime checks.
        tokenType: {type: string, const: Bearer}
        expiresAt: {type: string, format: date-time}
        expiresIn: {type: integer, minimum: 1}
        licenseId: {type: string}
        licenseDigest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        deploymentId: {type: string}
        features: {type: array, items: {type: string}}
        modelScopes:
          description: Model identifiers authorized for this deployment entitlement.
          type: array
          items: {type: string}
    CreatePlatformUserRequest:
      type: object
      required: [deploymentId, username, displayName, temporaryPassword, teamIds, roleIds]
      properties:
        deploymentId: {type: string}
        username: {type: string, minLength: 1, maxLength: 256}
        displayName: {type: string, minLength: 1, maxLength: 256}
        email: {type: [string, 'null'], format: email}
        temporaryPassword: {type: string, minLength: 12, maxLength: 1024, writeOnly: true}
        teamIds: {type: array, minItems: 1, maxItems: 64, items: {type: string}, uniqueItems: true}
        roleIds: {type: array, minItems: 1, maxItems: 64, items: {type: string}, uniqueItems: true}
        requirePasswordChange: {type: boolean, default: true}
    ImportPlatformUsersRequest:
      type: object
      required: [deploymentId, users]
      properties:
        deploymentId: {type: string}
        users:
          type: array
          minItems: 1
          maxItems: 1000
          items: {$ref: '#/components/schemas/ImportPlatformUser'}
    ImportPlatformUser:
      type: object
      required: [externalRowId, username, displayName, temporaryPassword, teamIds, roleIds]
      properties:
        externalRowId: {type: string}
        username: {type: string, minLength: 1, maxLength: 256}
        displayName: {type: string, minLength: 1, maxLength: 256}
        email: {type: [string, 'null'], format: email}
        temporaryPassword: {type: string, minLength: 12, maxLength: 1024, writeOnly: true}
        teamIds: {type: array, minItems: 1, maxItems: 64, items: {type: string}, uniqueItems: true}
        roleIds: {type: array, minItems: 1, maxItems: 64, items: {type: string}, uniqueItems: true}
        requirePasswordChange: {type: boolean, default: true}
    ImportPlatformUsersResponse:
      type: object
      required: [created, rejected]
      properties:
        created: {type: integer, minimum: 0}
        rejected: {type: integer, minimum: 0}
        errors:
          type: array
          items:
            type: object
            required: [externalRowId, code, detail]
            properties:
              externalRowId: {type: string}
              code: {type: string}
              detail: {type: string}
    UpdatePlatformUserRequest:
      type: object
      minProperties: 1
      properties:
        displayName: {type: string, minLength: 1, maxLength: 256}
        email: {type: [string, 'null'], format: email}
        status: {type: string, enum: [active, disabled]}
        teamIds: {type: array, items: {type: string}, uniqueItems: true}
        roleIds: {type: array, items: {type: string}, uniqueItems: true}
    ResetPasswordRequest:
      type: object
      required: [temporaryPassword]
      properties:
        temporaryPassword: {type: string, minLength: 12, maxLength: 1024, writeOnly: true}
        requirePasswordChange: {type: boolean, default: true}
    PlatformUser:
      type: object
      required: [id, deploymentId, username, displayName, status, createdAt, updatedAt]
      properties:
        id: {type: string}
        deploymentId: {type: string}
        username: {type: string}
        displayName: {type: string}
        email: {type: [string, 'null'], format: email}
        status: {type: string, enum: [active, disabled]}
        teamIds: {type: array, items: {type: string}}
        roleIds: {type: array, items: {type: string}}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    PlatformUserPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/PlatformUser'}}
        nextCursor: {type: [string, 'null']}
    Permission:
      type: object
      required: [id, description]
      properties:
        id: {type: string}
        description: {type: string}
    PermissionPage:
      type: object
      required: [permissions]
      properties:
        permissions: {type: array, items: {$ref: '#/components/schemas/Permission'}}
    Role:
      type: object
      required: [id, name, description, builtIn, enabled, permissions]
      properties:
        id: {type: string}
        name: {type: string}
        description: {type: string}
        builtIn: {type: boolean}
        enabled: {type: boolean}
        permissions: {type: array, items: {type: string}}
    RolePage:
      type: object
      required: [roles, nextCursor]
      properties:
        roles: {type: array, items: {$ref: '#/components/schemas/Role'}}
        nextCursor: {type: [string, 'null']}
    CreateRoleRequest:
      type: object
      required: [id, name]
      additionalProperties: false
      properties:
        id: {type: string, minLength: 1, maxLength: 100}
        name: {type: string, minLength: 1, maxLength: 256}
        description: {type: string, maxLength: 1024}
        permissions: {type: array, maxItems: 128, uniqueItems: true, items: {type: string}}
    UpdateRoleRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 256}
        description: {type: string, maxLength: 1024}
        enabled: {type: boolean}
        permissions: {type: array, maxItems: 128, uniqueItems: true, items: {type: string}}
    Team:
      type: object
      required: [id, name, description, builtIn, enabled, memberCount, path, depth]
      properties:
        id: {type: string}
        name: {type: string}
        description: {type: string}
        builtIn: {type: boolean}
        enabled: {type: boolean}
        memberCount: {type: integer, minimum: 0}
        parentId: {type: [string, 'null'], description: Parent team. Omitted for root teams.}
        path: {type: string, description: 'Materialized team path, for example /hq/engineering.'}
        depth: {type: integer, minimum: 0, description: Distance from the team forest root.}
    TeamPage:
      type: object
      required: [teams, nextCursor]
      properties:
        teams: {type: array, items: {$ref: '#/components/schemas/Team'}}
        nextCursor: {type: [string, 'null']}
    CreateTeamRequest:
      type: object
      required: [id, name]
      additionalProperties: false
      properties:
        id: {type: string, minLength: 1, maxLength: 100}
        name: {type: string, minLength: 1, maxLength: 256}
        description: {type: string, maxLength: 1024}
        parentId: {type: [string, 'null'], maxLength: 100, description: 'Parent team. Immutable after creation; path and depth are fixed at creation, so cyclic hierarchies are impossible.'}
    UpdateTeamRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 256}
        description: {type: string, maxLength: 1024}
        enabled: {type: boolean}
    ReplaceUserRBACRequest:
      type: object
      required: [roleIds, teamIds]
      additionalProperties: false
      properties:
        roleIds: {type: array, minItems: 1, maxItems: 64, uniqueItems: true, items: {type: string}}
        teamIds: {type: array, minItems: 1, maxItems: 64, uniqueItems: true, items: {type: string}}
    UserRBAC:
      type: object
      required: [userId, roleIds, teamIds]
      properties:
        userId: {type: string}
        roleIds: {type: array, items: {type: string}}
        teamIds: {type: array, items: {type: string}}
    AgentIdentifier:
      description: Digital employee account identifier with RBAC identifier syntax.
      type: string
      minLength: 1
      maxLength: 100
      pattern: '^[A-Za-z0-9._-]+$'
    CreateAgentRequest:
      type: object
      additionalProperties: false
      required: [username, displayName, password, roleIds, homeTeamId]
      properties:
        username: {$ref: '#/components/schemas/AgentIdentifier'}
        displayName: {type: string, minLength: 1, maxLength: 256}
        password:
          type: string
          minLength: 8
          maxLength: 1024
          writeOnly: true
          description: Initial password of at least 8 characters. Stored only as an Argon2id hash under the deployment password policy.
        roleIds: {type: array, minItems: 1, maxItems: 64, items: {type: string}, uniqueItems: true}
        teamIds: {type: array, maxItems: 64, items: {type: string}, uniqueItems: true}
        homeTeamId: {type: string, minLength: 1, maxLength: 100, description: Primary team of the digital employee. Always granted in addition to teamIds.}
        displayTitle: {type: [string, 'null'], maxLength: 256}
        description: {type: [string, 'null'], maxLength: 2048}
        promptSkillId:
          type: [string, 'null']
          maxLength: 64
          description: Identifier of the Skill that carries the digital employee prompt. Optional.
    AgentResponse:
      type: object
      required: [id, username, displayName, homeTeamId, displayTitle]
      properties:
        id: {type: string}
        username: {type: string}
        displayName: {type: string}
        homeTeamId: {type: string}
        displayTitle: {type: string}
    AgentDirectoryEntry:
      type: object
      required: [id, username, displayName, status, online]
      properties:
        id: {type: string}
        username: {type: string}
        displayName: {type: string}
        status: {type: string, enum: [active, disabled]}
        online: {type: boolean}
        lastHeartbeatAt: {type: [string, 'null'], format: date-time}
        homeTeamId: {type: [string, 'null']}
        displayTitle: {type: [string, 'null']}
        description: {type: [string, 'null']}
        promptSkillId: {type: [string, 'null']}
    AgentDirectoryPage:
      type: object
      required: [agents, nextCursor]
      properties:
        agents: {type: array, items: {$ref: '#/components/schemas/AgentDirectoryEntry'}}
        nextCursor: {type: [string, 'null']}
    UpdateAgentProfileRequest:
      type: object
      additionalProperties: false
      description: >-
        Patch semantics: an absent field leaves the stored value unchanged.
        Unlike a JSON merge patch, an explicit null is indistinguishable from
        an absent field on the wire for this operation.
      properties:
        displayTitle: {type: string, maxLength: 256, description: New display title; an empty string clears the stored title.}
        description: {type: string, maxLength: 2048, description: New description; an empty string clears the stored description.}
        homeTeamId: {type: string, minLength: 1, maxLength: 100, description: New home team. Must exist and be grantable by the caller.}
        promptSkillId: {type: string, maxLength: 64, description: Identifier of the prompt Skill; an empty string clears the binding.}
    UpdateAgentProfileResponse:
      type: object
      required: [id, homeTeamId, displayTitle]
      properties:
        id: {type: string}
        homeTeamId: {type: string}
        displayTitle: {type: string}
    IdentitySourceKind:
      type: string
      enum: [ldap, oidc, directory]
      description: 'Protocol identity source category. Product-specific connector flavors are deployment config, not protocol vocabulary.'
    IdentitySource:
      type: object
      required: [id, kind, displayName, enabled]
      properties:
        id: {type: string}
        kind: {$ref: '#/components/schemas/IdentitySourceKind'}
        displayName: {type: string}
        enabled: {type: boolean}
    IdentitySourcePage:
      type: object
      required: [identitySources, nextCursor]
      properties:
        identitySources: {type: array, items: {$ref: '#/components/schemas/IdentitySource'}}
        nextCursor: {type: [string, 'null']}
    CreateIdentitySourceRequest:
      type: object
      additionalProperties: false
      required: [id, kind, displayName]
      properties:
        id: {type: string, minLength: 1, maxLength: 100, pattern: '^[A-Za-z0-9._-]+$'}
        kind: {$ref: '#/components/schemas/IdentitySourceKind'}
        displayName: {type: string, minLength: 1, maxLength: 256}
        config:
          type: object
          additionalProperties: true
          default: {}
          description: 'Connector settings as a plain JSON object. MUST NOT contain secret keys such as password, secret, token, apikey, clientsecret, or bindpassword; secret material may only be expressed as credential store references.'
    IdentityMapping:
      type: object
      required: [sourceId, externalSubjectType, externalId, localSubjectId, status]
      properties:
        sourceId: {type: string}
        externalSubjectType: {type: string, enum: [user, team]}
        externalId: {type: string}
        localSubjectId: {type: string}
        status: {type: string, enum: [active, disabled]}
    IdentityMappingPage:
      type: object
      required: [mappings, nextCursor]
      properties:
        mappings: {type: array, items: {$ref: '#/components/schemas/IdentityMapping'}}
        nextCursor: {type: [string, 'null']}
    UpsertIdentityMappingRequest:
      type: object
      additionalProperties: false
      required: [externalSubjectType, externalId, localSubjectId]
      properties:
        externalSubjectType: {type: string, enum: [user, team]}
        externalId: {type: string, minLength: 1, maxLength: 256}
        localSubjectId: {type: string, minLength: 1, maxLength: 256}
    IdentityMappingResult:
      type: object
      required: [sourceId, externalId, localSubjectId]
      properties:
        sourceId: {type: string}
        externalId: {type: string}
        localSubjectId: {type: string}
    DataScopeRuleKind:
      type: string
      enum: [management_scope, exception_grant, explicit_deny]
    DataScopeResourceKind:
      type: string
      minLength: 1
      maxLength: 64
      pattern: '^[a-z][a-z0-9_-]*$'
      description: 'The protocol-defined team kind, or a deployment-defined lowercase identifier. The protocol does not enumerate deployment kinds and treats them as opaque references.'
    DataScopeRule:
      type: object
      required: [id, ruleKind, subjectType, subjectId, resourceKind, resourceId, reason]
      properties:
        id: {type: string}
        ruleKind: {$ref: '#/components/schemas/DataScopeRuleKind'}
        subjectType: {type: string, enum: [user, role, team]}
        subjectId: {type: string}
        resourceKind: {$ref: '#/components/schemas/DataScopeResourceKind'}
        resourceId: {type: string}
        startsAt: {type: [string, 'null'], format: date-time}
        expiresAt: {type: [string, 'null'], format: date-time}
        reason: {type: string}
    DataScopeRulePage:
      type: object
      required: [rules, nextCursor]
      properties:
        rules: {type: array, items: {$ref: '#/components/schemas/DataScopeRule'}}
        nextCursor: {type: [string, 'null']}
    CreateDataScopeRuleRequest:
      type: object
      additionalProperties: false
      required: [id, ruleKind, subjectType, subjectId, resourceKind, resourceId]
      properties:
        id: {type: string, minLength: 1, maxLength: 100, pattern: '^[A-Za-z0-9._-]+$'}
        ruleKind: {$ref: '#/components/schemas/DataScopeRuleKind'}
        subjectType: {type: string, enum: [user, role, team]}
        subjectId: {type: string, minLength: 1, maxLength: 256}
        resourceKind: {$ref: '#/components/schemas/DataScopeResourceKind'}
        resourceId: {type: string, minLength: 1, maxLength: 256}
        startsAt: {type: [string, 'null'], format: date-time}
        expiresAt: {type: [string, 'null'], format: date-time, description: Temporary grant that stops authorizing at this time.}
        reason: {type: [string, 'null'], maxLength: 1024}
    DataScopeResourceRef:
      type: object
      required: [kind, id]
      properties:
        kind: {$ref: '#/components/schemas/DataScopeResourceKind'}
        id: {type: string}
    RetrievalContext:
      type: object
      required: [principalId, deploymentId, orgScope, roleScope]
      properties:
        principalId: {type: string}
        deploymentId: {type: string}
        orgScope: {type: array, items: {type: string}, description: Team subtree identifiers the principal may retrieve.}
        ownTeamIds: {type: array, items: {type: string}}
        roleScope: {type: array, items: {type: string}}
        allowedResources:
          type: array
          items: {$ref: '#/components/schemas/DataScopeResourceRef'}
          description: 'Explicitly granted (kind, id) references.'
        deniedResources:
          type: array
          items: {$ref: '#/components/schemas/DataScopeResourceRef'}
          description: 'Explicitly denied (kind, id) references. Deny wins over allow.'
        crossDepartmentReason: {type: string, description: Reason recorded when a rule extends scope beyond the principal's own team subtree.}
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: {type: string, format: uri-reference}
        title: {type: string}
        status: {type: integer, minimum: 400, maximum: 599}
        detail: {type: string}
        instance: {type: string, format: uri-reference}
        code: {type: string}
        requestId: {type: string}
