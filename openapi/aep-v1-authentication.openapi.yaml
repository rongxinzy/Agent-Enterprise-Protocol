openapi: 3.1.0
info:
  title: Agent Enterprise Protocol Authentication API
  version: 1.0.0-draft
  description: >-
    AEP v1 authentication, platform-account administration, and login-issued
    Model Gateway credential contract.
  license: {name: Apache 2.0, identifier: Apache-2.0}
servers:
  - url: https://enterprise.example.com/aep/v1
    description: HTTPS deployment
  - url: http://enterprise.example.com/aep/v1
    description: HTTP deployment
  - url: http://localhost:8080/aep/v1
    description: Local development
tags:
  - {name: Authentication}
  - {name: Admin Users}
paths:
  /auth/methods:
    get:
      tags: [Authentication]
      operationId: getAuthenticationMethods
      security: []
      parameters:
        - name: enterpriseHint
          in: query
          required: true
          schema: {type: string, minLength: 1}
      responses:
        '200':
          description: Available authentication methods
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuthenticationMethods'}
        '404': {$ref: '#/components/responses/Problem'}
  /auth/password/login:
    post:
      tags: [Authentication]
      operationId: loginWithPassword
      description: >-
        Authenticates an administrator-provisioned ZhiYuan platform account.
        HTTP and HTTPS are valid in development and production. HTTPS is
        strongly recommended outside a trusted private network because plain
        HTTP exposes credentials and bearer tokens in transit.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PasswordLoginRequest'}
      responses:
        '200': {$ref: '#/components/responses/TokenResponse'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
  /auth/federated/start:
    post:
      tags: [Authentication]
      operationId: startFederatedLogin
      description: >-
        Starts a system-browser login through a customer OIDC provider or
        another server-side identity adapter.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FederatedLoginStartRequest'}
      responses:
        '200':
          description: Federated login transaction
          content:
            application/json:
              schema: {$ref: '#/components/schemas/FederatedLoginStartResponse'}
        '400': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /auth/exchange:
    post:
      tags: [Authentication]
      operationId: exchangeFederatedAuthorizationCode
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/FederatedExchangeRequest'}
      responses:
        '200': {$ref: '#/components/responses/TokenResponse'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
  /auth/refresh:
    post:
      tags: [Authentication]
      operationId: refreshAuthenticationSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RefreshRequest'}
      responses:
        '200': {$ref: '#/components/responses/TokenResponse'}
        '401': {$ref: '#/components/responses/Problem'}
  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logoutAuthenticationSession
      security:
        - aepBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LogoutRequest'}
      responses:
        '204': {description: Session revoked}
        '401': {$ref: '#/components/responses/Problem'}
  /agent/activation:
    post:
      tags: [Authentication]
      operationId: activateEnterpriseLicense
      description: >-
        Exchanges evidence from a locally verified enterprise license for a
        short-lived Control Service entitlement token. The service never
        receives license signing private keys. Clients MUST verify the signed
        license envelope locally before calling this operation.
      security:
        - aepBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/LicenseActivationRequest'}
      responses:
        '200':
          description: Enterprise entitlement token
          content:
            application/json:
              schema: {$ref: '#/components/schemas/EntitlementTokenResponse'}
        '400': {$ref: '#/components/responses/Problem'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /admin/users:
    get:
      tags: [Admin Users]
      operationId: listPlatformUsers
      security:
        - aepBearerAuth: []
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Platform user page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlatformUserPage'}
        '401': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
    post:
      tags: [Admin Users]
      operationId: createPlatformUser
      security:
        - aepBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreatePlatformUserRequest'}
      responses:
        '201':
          description: Platform user created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlatformUser'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
  /admin/users/import:
    post:
      tags: [Admin Users]
      operationId: importPlatformUsers
      description: Imports at most 1000 administrator-provisioned accounts.
      security:
        - aepBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ImportPlatformUsersRequest'}
      responses:
        '200':
          description: Import result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ImportPlatformUsersResponse'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
  /admin/users/{userId}:
    patch:
      tags: [Admin Users]
      operationId: updatePlatformUser
      security:
        - aepBearerAuth: []
      parameters:
        - {$ref: '#/components/parameters/UserId'}
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema: {$ref: '#/components/schemas/UpdatePlatformUserRequest'}
      responses:
        '200':
          description: Platform user updated
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PlatformUser'}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /admin/users/{userId}/reset-password:
    post:
      tags: [Admin Users]
      operationId: resetPlatformUserPassword
      security:
        - aepBearerAuth: []
      parameters:
        - {$ref: '#/components/parameters/UserId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ResetPasswordRequest'}
      responses:
        '204': {description: Temporary password set and refresh sessions revoked}
        '400': {$ref: '#/components/responses/Problem'}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    aepBearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    UserId: {name: userId, in: path, required: true, schema: {type: string}}
    Cursor: {name: cursor, in: query, schema: {type: [string, 'null']}}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 200, default: 50}}
  responses:
    Problem:
      description: AEP Problem Details
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    TokenResponse:
      description: >-
        AEP session tokens. The model token is issued at login or refresh and
        is validated locally by the Model Gateway without a per-request
        authorization call to the Control Service.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/TokenResponse'}
  schemas:
    AuthenticationMethods:
      type: object
      description: >-
        Authentication methods enabled for the enterprise. The built-in
        password method has the stable ID zhiyuan-password. Federated methods
        are optional and MUST NOT be returned unless a production identity
        adapter is configured.
      required: [enterprise, methods]
      properties:
        enterprise: {$ref: '#/components/schemas/Enterprise'}
        preferredMethodId:
          type: [string, 'null']
          description: The ID of the preferred enabled method. Defaults to zhiyuan-password for the password-only production profile.
        methods:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/AuthenticationMethod'}
    AuthenticationMethod:
      type: object
      required: [id, type, displayName]
      properties:
        id: {type: string}
        type: {type: string, enum: [password, federated]}
        protocol: {type: [string, 'null'], enum: [oidc, saml, custom, null]}
        displayName: {type: string}
    Enterprise:
      type: object
      required: [id, name]
      properties:
        id: {type: string}
        name: {type: string}
    AgentContext:
      type: object
      required: [agentId, agentVersion, platform]
      properties:
        agentId: {type: string, minLength: 1}
        agentVersion: {type: string, minLength: 1}
        platform: {type: string, enum: [windows, macos, linux]}
    PasswordLoginRequest:
      allOf:
        - $ref: '#/components/schemas/AgentContext'
        - type: object
          required: [enterpriseId, username, password]
          properties:
            enterpriseId: {type: string, minLength: 1}
            username: {type: string, minLength: 1, maxLength: 256}
            password: {type: string, minLength: 1, maxLength: 1024, writeOnly: true}
    FederatedLoginStartRequest:
      type: object
      required: [enterpriseId, methodId, redirectUri, codeChallenge]
      properties:
        enterpriseId: {type: string, minLength: 1}
        methodId: {type: string, minLength: 1}
        redirectUri: {type: string, format: uri}
        codeChallenge: {type: string, minLength: 43, maxLength: 128}
        codeChallengeMethod: {type: string, const: S256, default: S256}
    FederatedLoginStartResponse:
      type: object
      required: [transactionId, authorizationUrl, state, expiresIn]
      properties:
        transactionId: {type: string}
        authorizationUrl: {type: string, format: uri}
        state: {type: string, minLength: 16}
        expiresIn: {type: integer, minimum: 1, maximum: 600}
    FederatedExchangeRequest:
      allOf:
        - $ref: '#/components/schemas/AgentContext'
        - type: object
          required: [transactionId, authorizationCode, redirectUri, codeVerifier]
          properties:
            transactionId: {type: string, minLength: 1}
            authorizationCode: {type: string, minLength: 1}
            redirectUri: {type: string, format: uri}
            codeVerifier: {type: string, minLength: 43, maxLength: 128, writeOnly: true}
    RefreshRequest:
      type: object
      required: [refreshToken, agentId]
      properties:
        refreshToken: {type: string, minLength: 1, writeOnly: true}
        agentId: {type: string, minLength: 1}
    LogoutRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: {type: string, minLength: 1, writeOnly: true}
    TokenResponse:
      type: object
      required:
        - accessToken
        - refreshToken
        - modelAccessToken
        - tokenType
        - expiresIn
        - modelAccessExpiresIn
        - passwordChangeRequired
      properties:
        accessToken:
          type: string
          description: Bearer token for AEP management APIs.
        refreshToken: {type: string, writeOnly: true}
        modelAccessToken:
          type: string
          description: >-
            Bearer token with a Model Gateway audience and model grant claims.
            The gateway validates it locally on each inference request.
        tokenType: {type: string, const: Bearer}
        expiresIn: {type: integer, minimum: 1}
        modelAccessExpiresIn: {type: integer, minimum: 1}
        passwordChangeRequired:
          type: boolean
          description: >-
            When true, the access session is restricted to current identity,
            password change, and logout operations. The model token has no
            model scopes until the password is changed.
    LicenseActivationRequest:
      type: object
      required: [licenseId, licenseDigest, deploymentId, expiresAt, features]
      additionalProperties: false
      properties:
        licenseId: {type: string, minLength: 1, maxLength: 256}
        licenseDigest:
          type: string
          pattern: '^sha256:[0-9a-f]{64}$'
          description: SHA-256 digest of the canonical signed license envelope.
        deploymentId: {type: string, minLength: 1, maxLength: 256}
        expiresAt: {type: string, format: date-time}
        features:
          type: array
          maxItems: 256
          uniqueItems: true
          items: {type: string, minLength: 1, maxLength: 128}
    EntitlementTokenResponse:
      type: object
      required: [entitlementToken, tokenType, expiresAt, expiresIn, licenseId, licenseDigest, deploymentId, features]
      properties:
        entitlementToken:
          type: string
          description: Short-lived service-signed token for enterprise runtime checks.
        tokenType: {type: string, const: Bearer}
        expiresAt: {type: string, format: date-time}
        expiresIn: {type: integer, minimum: 1}
        licenseId: {type: string}
        licenseDigest: {type: string, pattern: '^sha256:[0-9a-f]{64}$'}
        deploymentId: {type: string}
        features: {type: array, items: {type: string}}
    CreatePlatformUserRequest:
      type: object
      required: [enterpriseId, username, displayName, temporaryPassword]
      properties:
        enterpriseId: {type: string}
        username: {type: string, minLength: 1, maxLength: 256}
        displayName: {type: string, minLength: 1, maxLength: 256}
        email: {type: [string, 'null'], format: email}
        temporaryPassword: {type: string, minLength: 12, maxLength: 1024, writeOnly: true}
        organizationIds: {type: array, items: {type: string}, uniqueItems: true}
        roleIds: {type: array, items: {type: string}, uniqueItems: true}
        requirePasswordChange: {type: boolean, default: true}
    ImportPlatformUsersRequest:
      type: object
      required: [enterpriseId, users]
      properties:
        enterpriseId: {type: string}
        users:
          type: array
          minItems: 1
          maxItems: 1000
          items: {$ref: '#/components/schemas/ImportPlatformUser'}
    ImportPlatformUser:
      type: object
      required: [externalRowId, username, displayName, temporaryPassword]
      properties:
        externalRowId: {type: string}
        username: {type: string, minLength: 1, maxLength: 256}
        displayName: {type: string, minLength: 1, maxLength: 256}
        email: {type: [string, 'null'], format: email}
        temporaryPassword: {type: string, minLength: 12, maxLength: 1024, writeOnly: true}
        organizationIds: {type: array, items: {type: string}, uniqueItems: true}
        roleIds: {type: array, items: {type: string}, uniqueItems: true}
        requirePasswordChange: {type: boolean, default: true}
    ImportPlatformUsersResponse:
      type: object
      required: [created, rejected]
      properties:
        created: {type: integer, minimum: 0}
        rejected: {type: integer, minimum: 0}
        errors:
          type: array
          items:
            type: object
            required: [externalRowId, code, detail]
            properties:
              externalRowId: {type: string}
              code: {type: string}
              detail: {type: string}
    UpdatePlatformUserRequest:
      type: object
      minProperties: 1
      properties:
        displayName: {type: string, minLength: 1, maxLength: 256}
        email: {type: [string, 'null'], format: email}
        status: {type: string, enum: [active, disabled]}
        organizationIds: {type: array, items: {type: string}, uniqueItems: true}
        roleIds: {type: array, items: {type: string}, uniqueItems: true}
    ResetPasswordRequest:
      type: object
      required: [temporaryPassword]
      properties:
        temporaryPassword: {type: string, minLength: 12, maxLength: 1024, writeOnly: true}
        requirePasswordChange: {type: boolean, default: true}
    PlatformUser:
      type: object
      required: [id, enterpriseId, username, displayName, status, createdAt, updatedAt]
      properties:
        id: {type: string}
        enterpriseId: {type: string}
        username: {type: string}
        displayName: {type: string}
        email: {type: [string, 'null'], format: email}
        status: {type: string, enum: [active, disabled]}
        organizationIds: {type: array, items: {type: string}}
        roleIds: {type: array, items: {type: string}}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    PlatformUserPage:
      type: object
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/PlatformUser'}}
        nextCursor: {type: [string, 'null']}
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: {type: string, format: uri-reference}
        title: {type: string}
        status: {type: integer, minimum: 400, maximum: 599}
        detail: {type: string}
        instance: {type: string, format: uri-reference}
        code: {type: string}
        requestId: {type: string}
