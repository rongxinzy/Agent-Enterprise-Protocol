  /aep/v1/admin/model-assignments:
    get:
      tags:
        - Admin Models
      operationId: listModelAssignments
      responses:
        '200':
          $ref: '#/components/responses/ModelAssignmentList'
    post:
      tags:
        - Admin Models
      operationId: createModelAssignment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ModelAssignmentWrite'
      responses:
        '201':
          $ref: '#/components/responses/ModelAssignment'
  /aep/v1/admin/model-assignments/{assignmentId}:
    delete:
      tags:
        - Admin Models
      operationId: deleteModelAssignment
      parameters:
        - $ref: '#/components/parameters/AssignmentId'
      responses:
        '204':
          description: Assignment removed
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    ServiceMetadata:
      type: object
      required:
        - service
        - supportedProtocolVersions
        - capabilities
        - jwksUri
      properties:
        service:
          type: string
        supportedProtocolVersions:
          type: array
          items:
            type: string
        capabilities:
          type: array
          uniqueItems: true
          items:
            type: string
            enum:
              - password_auth
              - federated_auth
              - skills
              - telemetry
              - control_events
              - model_gateway
              - credentials
              - mcp
              - plugins
        jwksUri:
          type: string
          format: uri-reference
        modelGateway:
          $ref: '#/components/schemas/ModelGatewayMetadata'
          description: Present when the model_gateway capability is enabled.
    ModelGatewayMetadata:
      type: object
      required:
        - baseUrl
        - protocol
        - apiVersion
      properties:
        baseUrl:
          type: string
          format: uri-reference
        protocol:
          type: string
          const: openai-compatible
        apiVersion:
          type: string
          const: v1
    PasswordChangeRequest:
      type: object
      required:
        - currentPassword
        - newPassword
      properties:
        currentPassword:
          type: string
          minLength: 1
          maxLength: 1024
          writeOnly: true
        newPassword:
          type: string
          minLength: 12
          maxLength: 1024
          writeOnly: true
    JsonWebKeySet:
      type: object
      required:
        - keys
      properties:
        keys:
          type: array
          items:
            type: object
            required:
              - kty
              - kid
              - use
              - alg
              - crv
              - x
            properties:
              kty:
                type: string
                const: OKP
              kid:
                type: string
              use:
                type: string
                const: sig
              alg:
                type: string
                const: EdDSA
              crv:
                type: string
                const: Ed25519
              x:
                type: string
    Deployment:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
    AuthenticationMethod:
      type: object
      required:
        - id
        - type
        - displayName
      properties:
        id:
          type: string
        type:
          type: string
          enum:
            - password
            - federated
        protocol:
          type:
            - string
            - 'null'
          enum:
            - oidc
            - saml
            - custom
            - null
        displayName:
          type: string
    AuthenticationMethods:
      type: object
      description: Authentication methods enabled for the deployment. The built-in password method has the stable ID zhiyuan-password. Federated methods are optional and MUST NOT be returned unless a production identity adapter is configured.
      required:
        - deployment
        - methods
      properties:
        deployment:
          $ref: '#/components/schemas/Deployment'
        deploymentId:
          type: string
          minLength: 1
        preferredMethodId:
          type:
            - string
            - 'null'
          description: The ID of the preferred enabled method. Defaults to zhiyuan-password for the password-only production profile.
        methods:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/AuthenticationMethod'
    Problem:
      type: object
      required:
        - type
        - title
        - status
        - code
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
        code:
          type: string
        requestId:
          type: string
    PasswordLoginRequest:
      type: object
      required:
        - deploymentId
        - username
        - password
      properties:
        deploymentId:
          type: string
          minLength: 1
        sessionId:
          type: string
          minLength: 1
        username:
          type: string
          minLength: 1
          maxLength: 256
        password:
          type: string
          minLength: 1
          maxLength: 1024
          writeOnly: true
    TokenResponse:
      type: object
      required:
        - accessToken
        - refreshToken
        - modelAccessToken
        - tokenType
        - expiresIn
        - modelAccessExpiresIn
        - passwordChangeRequired
      properties:
        accessToken:
          type: string
          description: Bearer token for AEP management APIs.
        refreshToken:
          type: string
          writeOnly: true
        modelAccessToken:
          type: string
          description: Bearer token with a Model Gateway audience and model grant claims. The gateway validates it locally on each inference request.
        tokenType:
          type: string
          const: Bearer
        expiresIn:
          type: integer
          minimum: 1
        modelAccessExpiresIn:
          type: integer
          minimum: 1
        deploymentId:
          type: string
          minLength: 1
        sessionId:
          type: string
          minLength: 1
        passwordChangeRequired:
          type: boolean
          description: When true, the access session is restricted to current identity, password change, and logout operations. The model token has no model scopes until the password is changed.
    FederatedLoginStartRequest:
      type: object
      required:
        - deploymentId
        - methodId
        - redirectUri
        - codeChallenge
      properties:
        deploymentId:
          type: string
          minLength: 1
        sessionId:
          type: string
          minLength: 1
        methodId:
          type: string
          minLength: 1
        redirectUri:
          type: string
          format: uri
        codeChallenge:
          type: string
          minLength: 43
          maxLength: 128
        codeChallengeMethod:
          type: string
          const: S256
          default: S256
    FederatedLoginStartResponse:
      type: object
      required:
        - transactionId
        - authorizationUrl
        - state
        - expiresIn
      properties:
        transactionId:
          type: string
        authorizationUrl:
          type: string
          format: uri
        state:
          type: string
          minLength: 16
        expiresIn:
          type: integer
          minimum: 1
          maximum: 600
    FederatedExchangeRequest:
      type: object
      required:
        - transactionId
        - authorizationCode
        - redirectUri
        - codeVerifier
      properties:
        transactionId:
          type: string
          minLength: 1
        authorizationCode:
          type: string
          minLength: 1
        redirectUri:
          type: string
          format: uri
        codeVerifier:
          type: string
          minLength: 43
          maxLength: 128
          writeOnly: true
    RefreshRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          minLength: 1
          writeOnly: true
        sessionId:
          type: string
          minLength: 1
          description: User session identifier.
    LogoutRequest:
      type: object
      required:
        - refreshToken
      properties:
        refreshToken:
          type: string
          minLength: 1
          writeOnly: true
    LicenseActivationRequest:
      type: object
      required:
        - license
      additionalProperties: false
      properties:
        license:
          type: object
          additionalProperties: false
          required:
            - format
            - keyId
            - payload
            - signature
          description: Complete vendor-signed License envelope.
          properties:
            format:
              type: string
              const: zhiyuan-license-v1
            keyId:
              type: string
              minLength: 1
              maxLength: 128
            payload:
              type: object
              additionalProperties: false
            signature:
              type: string
              minLength: 1
              maxLength: 256
    EntitlementTokenResponse:
      type: object
      required:
        - entitlementToken
        - tokenType
        - expiresAt
        - expiresIn
        - licenseId
        - licenseDigest
        - deploymentId
        - features
        - modelScopes
      properties:
        entitlementToken:
          type: string
          description: Short-lived service-signed token for deployment runtime checks.
        tokenType:
          type: string
          const: Bearer
        expiresAt:
          type: string
          format: date-time
        expiresIn:
          type: integer
          minimum: 1
        licenseId:
          type: string
        licenseDigest:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        deploymentId:
          type: string
        features:
          type: array
          items:
            type: string
        modelScopes:
          description: Model identifiers authorized for this deployment entitlement.
          type: array
          items:
            type: string
    User:
      type: object
      required:
        - id
        - displayName
      properties:
        id:
          type: string
        displayName:
          type: string
        email:
          type:
            - string
            - 'null'
          format: email
    CurrentIdentity:
      type: object
      required:
        - user
        - deployment
        - deploymentId
        - sessionId
        - roles
        - sessionExpiresAt
        - passwordChangeRequired
      properties:
        user:
          $ref: '#/components/schemas/User'
        deployment:
          $ref: '#/components/schemas/Deployment'
        deploymentId:
          type: string
          minLength: 1
        sessionId:
          type: string
        roles:
          type: array
          items:
            type: string
        sessionExpiresAt:
          type: string
          format: date-time
        passwordChangeRequired:
          type: boolean
    Problem-2:
      type: object
      required:
        - type
        - title
        - status
        - code
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        code:
          type: string
        requestId:
          type: string
    HeartbeatRequest:
      type: object
      required:
        - status
      properties:
        lastControlEventCursor:
          type:
            - string
            - 'null'
        status:
          type: string
          enum:
            - online
            - idle
            - busy
    HeartbeatResponse:
      type: object
      required:
        - serverTime
        - controlEvents
        - nextHeartbeatAfterSeconds
      properties:
        serverTime:
          type: string
          format: date-time
        controlEvents:
          type: object
          required:
            - pending
            - watermark
          properties:
            pending:
              type: boolean
            watermark:
              type: string
        nextHeartbeatAfterSeconds:
          type: integer
          minimum: 5
          maximum: 3600
    ControlEventType:
      type: string
      enum:
        - skill.manifest.changed
        - plugin.manifest.changed
        - credential.assignments.changed
        - model.catalog.changed
    GlobalScope:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          const: global
      additionalProperties: false
    TeamScope:
      type: object
      required:
        - type
        - id
      properties:
        type:
          type: string
          const: team
        id:
          type: string
      additionalProperties: false
    UserScope:
      type: object
      required:
        - type
        - id
      properties:
        type:
          type: string
          const: user
        id:
          type: string
      additionalProperties: false
    ControlEventScope:
      oneOf:
        - $ref: '#/components/schemas/GlobalScope'
        - $ref: '#/components/schemas/TeamScope'
        - $ref: '#/components/schemas/UserScope'
      discriminator:
        propertyName: type
    ControlEventResource:
      type: object
      required:
        - type
        - id
        - revision
      properties:
        type:
          type: string
          enum:
            - skill
            - plugin
            - credential
            - model
        id:
          type: string
        revision:
          type: string
    ControlTask:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          enum:
            - skill.reconcile
            - plugin.reconcile
            - credential.reconcile
            - model.reconcile
    ControlEventDelivery:
      type: object
      required:
        - deliveryId
        - eventId
        - cursor
        - type
        - scope
        - task
        - createdAt
        - expiresAt
      properties:
        deliveryId:
          type: string
        eventId:
          type: string
        cursor:
          type: string
        type:
          $ref: '#/components/schemas/ControlEventType'
        scope:
          $ref: '#/components/schemas/ControlEventScope'
        resource:
          $ref: '#/components/schemas/ControlEventResource'
        task:
          $ref: '#/components/schemas/ControlTask'
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    ControlEventPage:
      type: object
      required:
        - items
        - nextCursor
        - watermark
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ControlEventDelivery'
        nextCursor:
          type:
            - string
            - 'null'
        watermark:
          type: string
    AcknowledgeRequest:
      type: object
      required:
        - status
        - receivedAt
      properties:
        status:
          type: string
          const: received
        receivedAt:
          type: string
          format: date-time
    RunningResult:
      type: object
      required:
        - status
        - startedAt
      properties:
        status:
          type: string
          const: running
        startedAt:
          type: string
          format: date-time
    SucceededResult:
      type: object
      required:
        - status
        - completedAt
      properties:
        status:
          type: string
          const: succeeded
        completedAt:
          type: string
          format: date-time
        appliedRevision:
          type: string
    FailedResult:
      type: object
      required:
        - status
        - completedAt
        - errorCode
        - message
        - retryable
      properties:
        status:
          type: string
          const: failed
        completedAt:
          type: string
          format: date-time
        errorCode:
          type: string
        message:
          type: string
        retryable:
          type: boolean
    ControlEventResult:
      oneOf:
        - $ref: '#/components/schemas/RunningResult'
        - $ref: '#/components/schemas/SucceededResult'
        - $ref: '#/components/schemas/FailedResult'
      discriminator:
        propertyName: status
    SkillPackage:
      type: object
      required:
        - url
        - sha256
        - size
      properties:
        url:
          type: string
          format: uri-reference
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        size:
          type: integer
          minimum: 0
    SkillManifestItem:
      type: object
      required:
        - id
        - name
        - version
        - enabled
        - package
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
        version:
          type: string
        enabled:
          type: boolean
        package:
          $ref: '#/components/schemas/SkillPackage'
    SkillManifest:
      type: object
      required:
        - revision
        - generatedAt
        - skills
      properties:
        revision:
          type: string
        generatedAt:
          type: string
          format: date-time
        skills:
          type: array
          items:
            $ref: '#/components/schemas/SkillManifestItem'
    SkillSyncItem:
      type: object
      required:
        - skillId
        - version
        - action
        - status
      properties:
        skillId:
          type: string
        version:
          type: string
        action:
          type: string
          enum:
            - install
            - update
            - remove
            - unchanged
        status:
          type: string
          enum:
            - success
            - failed
        errorCode:
          type: string
        message:
          type: string
    SkillSyncResult:
      type: object
      required:
        - manifestRevision
        - startedAt
        - completedAt
        - status
        - items
      properties:
        manifestRevision:
          type: string
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
            - success
            - partial
            - failed
        items:
          type: array
          items:
            $ref: '#/components/schemas/SkillSyncItem'
    EventResource:
      type: object
      required:
        - type
        - id
      properties:
        type:
          type: string
        id:
          type: string
    EventResult:
      type: string
      enum:
        - success
        - failure
        - info
    UserEvent:
      type: object
      required:
        - eventId
        - type
        - occurredAt
        - result
      properties:
        eventId:
          type: string
        type:
          type: string
        occurredAt:
          type: string
          format: date-time
        resource:
          $ref: '#/components/schemas/EventResource'
        result:
          $ref: '#/components/schemas/EventResult'
        metadata:
          type: object
          additionalProperties: true
    EventBatchRequest:
      type: object
      required:
        - events
      properties:
        events:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/UserEvent'
    RejectedEvent:
      type: object
      required:
        - eventId
        - code
        - message
      properties:
        eventId:
          type: string
