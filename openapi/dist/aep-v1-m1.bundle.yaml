        '200':
          $ref: '#/components/responses/License'
        '404':
          $ref: '#/components/responses/Problem-2'
  /aep/v1/admin/licenses/import:
    post:
      tags:
        - Admin Licenses
      operationId: importLicense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LicenseImportRequest'
      responses:
        '201':
          $ref: '#/components/responses/License'
        '409':
          $ref: '#/components/responses/Problem-2'
        '422':
