          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminModelList'
    post:
      tags:
        - Admin Models
      operationId: createModel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminModelWrite'
      responses:
        '201':
          $ref: '#/components/responses/AdminModel'
  /aep/v1/admin/models/{modelId}:
    parameters:
      - $ref: '#/components/parameters/ModelId'
    get:
      tags:
        - Admin Models
      operationId: getModel
      responses:
        '200':
          $ref: '#/components/responses/AdminModel'
        '404':
          $ref: '#/components/responses/Problem-2'
    patch:
      tags:
        - Admin Models
      operationId: updateModel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminModelPatch'
