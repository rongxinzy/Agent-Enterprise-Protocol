          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/GatewayQuota"
        "400":
          "$ref": "#/components/responses/Problem"
        "401":
          "$ref": "#/components/responses/Problem"
        "403":
          "$ref": "#/components/responses/Problem"
        "404":
          "$ref": "#/components/responses/Problem"
        "409":
          "$ref": "#/components/responses/Problem"
        "422":
