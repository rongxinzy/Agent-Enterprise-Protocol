    "GatewayMetricDefinitionId":
      "$ref": "./aep-v1-gateway-schemas.openapi.yaml#/components/schemas/GatewayMetricDefinitionId"
    "GatewayMetricDefinition":
      "$ref": "./aep-v1-gateway-schemas.openapi.yaml#/components/schemas/GatewayMetricDefinition"
    "GatewayMetricResult":
      "$ref": "./aep-v1-gateway-schemas.openapi.yaml#/components/schemas/GatewayMetricResult"
    "GatewayNativeResult":
      "$ref": "./aep-v1-gateway-schemas.openapi.yaml#/components/schemas/GatewayNativeResult"
    "GatewayHealth":
      "$ref": "./aep-v1-gateway-schemas.openapi.yaml#/components/schemas/GatewayHealth"
    "GatewayLimitWrite":
      "$ref": "./aep-v1-gateway-schemas.openapi.yaml#/components/schemas/GatewayLimitWrite"
    "GatewayLimit":
      "$ref": "./aep-v1-gateway-schemas.openapi.yaml#/components/schemas/GatewayLimit"
    "GatewayLimitPage":
