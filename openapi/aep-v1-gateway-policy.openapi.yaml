        "503":
          "$ref": "#/components/responses/Problem"
      "parameters":
        -
          "name": "userId"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "minLength": 1
            "maxLength": 200
  "/aep/v1/admin/model-gateway/quotas/{userId}/refresh":
    "post":
      "tags":
        - "Admin Model Gateway"
      "operationId": "refreshGatewayQuota"
      "summary": "refresh Gateway Quota"
      "responses":
        "200":
          "description": "Native source result or managed configuration"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/GatewayQuota"
        "400":
          "$ref": "#/components/responses/Problem"
        "401":
          "$ref": "#/components/responses/Problem"
        "403":
          "$ref": "#/components/responses/Problem"
        "404":
          "$ref": "#/components/responses/Problem"
        "409":
          "$ref": "#/components/responses/Problem"
        "422":
          "$ref": "#/components/responses/Problem"
        "503":
          "$ref": "#/components/responses/Problem"
      "parameters":
        -
          "name": "userId"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "minLength": 1
            "maxLength": 200
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/GatewayQuotaRefresh"
  "/aep/v1/admin/model-gateway/quotas/{userId}/delta":
    "post":
      "tags":
        - "Admin Model Gateway"
      "operationId": "changeGatewayQuota"
      "summary": "change Gateway Quota"
      "responses":
        "200":
          "description": "Native source result or managed configuration"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/GatewayQuota"
        "400":
          "$ref": "#/components/responses/Problem"
        "401":
          "$ref": "#/components/responses/Problem"
        "403":
          "$ref": "#/components/responses/Problem"
        "404":
          "$ref": "#/components/responses/Problem"
        "409":
          "$ref": "#/components/responses/Problem"
        "422":
          "$ref": "#/components/responses/Problem"
        "503":
          "$ref": "#/components/responses/Problem"
      "parameters":
        -
          "name": "userId"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "minLength": 1
            "maxLength": 200
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/GatewayQuotaDelta"
  "/aep/v1/admin/model-gateway/tokens":
    "post":
      "tags":
        - "Admin Model Gateway"
      "operationId": "issueModelGatewayToken"
      "summary": "issue a data-plane model token on behalf of a user"
      "description": >-
        Machine-to-machine issuance for governed runtimes: a service account
        with models.read obtains a short-lived data-plane token whose model
        scopes are derived from the target user's assignments (never wider).
        The sessionId is caller-supplied conversation context used for gateway
        log correlation; when omitted an m2m-prefixed synthetic session id is
        minted. Every issuance is audited.
      "requestBody":
        "required": true
        "content":
          "application/json":
            "schema":
              "$ref": "#/components/schemas/GatewayModelTokenRequest"
      "responses":
        "200":
          "description": "Issued model token"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/GatewayModelToken"
        "400":
          "$ref": "#/components/responses/Problem"
        "401":
          "$ref": "#/components/responses/Problem"
        "403":
          "$ref": "#/components/responses/Problem"
        "404":
          "$ref": "#/components/responses/Problem"
        "422":
          "$ref": "#/components/responses/Problem"
        "503":
          "$ref": "#/components/responses/Problem"
  "/aep/v1/admin/model-gateway/models/{modelId}/test-access":
    "post":
      "tags":
        - "Admin Model Gateway"
      "operationId": "createGatewayTestAccess"
      "summary": "create Gateway Test Access"
      "responses":
        "200":
          "description": "Native source result or managed configuration"
          "content":
            "application/json":
              "schema":
                "$ref": "#/components/schemas/GatewayTestAccess"
        "400":
          "$ref": "#/components/responses/Problem"
        "401":
          "$ref": "#/components/responses/Problem"
        "403":
          "$ref": "#/components/responses/Problem"
        "404":
          "$ref": "#/components/responses/Problem"
        "409":
          "$ref": "#/components/responses/Problem"
        "422":
          "$ref": "#/components/responses/Problem"
        "503":
          "$ref": "#/components/responses/Problem"
      "parameters":
        -
          "name": "modelId"
          "in": "path"
          "required": true
          "schema":
            "type": "string"
            "minLength": 1
            "maxLength": 200
